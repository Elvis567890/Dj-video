name: Build Pro DJ Video Mixer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create multi-module directory structure
        run: |
          mkdir -p app/src/main/java/com/djpro/mixer
          mkdir -p app/src/main/res/values
          mkdir -p core-audio/src/main/java/com/djpro/audio
          mkdir -p core-dsp/src/main/java/com/djpro/dsp
          mkdir -p core-stems/src/main/java/com/djpro/stems
          mkdir -p core-stems/src/main/cpp
          mkdir -p core-video/src/main/java/com/djpro/video
          mkdir -p core-db/src/main/java/com/djpro/db
          mkdir -p native/src/main/cpp/oboe
          mkdir -p native/src/main/cpp/demucs
          mkdir -p gradle/wrapper

      - name: Root gradle files
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DJVideoMixerPro"
          include(":app")
          include(":core-audio")
          include(":core-dsp")
          include(":core-stems")
          include(":core-video")
          include(":core-db")
          include(":native")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("com.android.library") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          android.defaultConfig.ndk.abiFilters=arm64-v8a
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Setup Gradle and generate wrapper
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle wrapper --gradle-version 8.7

      # ==================== NATIVE MODULE (Oboe + Demucs) ====================

      - name: native/build.gradle.kts
        run: |
          cat > native/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.djpro.native"
              compileSdk = 34
              ndkVersion = "26.1.10909125"
              defaultConfig {
                  minSdk = 26
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += "-DANDROID_STL=c++_shared"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          cat > native/src/main/cpp/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.22.1)
          project("djpro_native")

          # Oboe – download at build time from GitHub releases
          include(FetchContent)
          FetchContent_Declare(
              oboe
              GIT_REPOSITORY https://github.com/google/oboe.git
              GIT_TAG 1.9.0
          )
          FetchContent_MakeAvailable(oboe)

          add_library(djpro_native SHARED
              oboe/OboeEngine.cpp
              demucs/DemucsBridge.cpp
          )

          target_link_libraries(djpro_native
              oboe::oboe
              android
              log
          )
          EOF

      - name: native OboeEngine.cpp
        run: |
          cat > native/src/main/cpp/oboe/OboeEngine.cpp << 'EOF'
          #include <oboe/Oboe.h>
          #include <android/log.h>
          #include <cmath>
          #include <vector>
          #include <mutex>

          #define LOG_TAG "DJProOboe"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          class OboeEngine : public oboe::AudioStreamDataCallback,
                             public oboe::AudioStreamErrorCallback {
          public:
              oboe::DataCallbackResult onAudioReady(
                  oboe::AudioStream *stream, void *audioData, int32_t numFrames) override {
                  float *out = static_cast<float*>(audioData);
                  int ch = stream->getChannelCount();
                  std::lock_guard<std::mutex> lock(mMutex);
                  // Mix up to 6 deck buffers
                  for (int i = 0; i < numFrames * ch; ++i) out[i] = 0.0f;
                  for (auto &deck : mDecks) {
                      if (!deck.active) continue;
                      for (int i = 0; i < numFrames; ++i) {
                          if (deck.pos >= deck.buffer.size()) { deck.active = false; break; }
                          float s = deck.buffer[deck.pos++] * deck.volume;
                          for (int c = 0; c < ch; ++c) out[i*ch + c] += s;
                      }
                  }
                  for (int i = 0; i < numFrames * ch; ++i)
                      out[i] = std::tanh(out[i]);  // soft clip
                  return oboe::DataCallbackResult::Continue;
              }

              void onErrorAfterClose(oboe::AudioStream*, oboe::Result) override {
                  LOGI("Stream error, restarting");
                  start();
              }

              bool start() {
                  oboe::AudioStreamBuilder b;
                  b.setDirection(oboe::Direction::Output);
                  b.setPerformanceMode(oboe::PerformanceMode::LowLatency);
                  b.setSharingMode(oboe::SharingMode::Exclusive);
                  b.setFormat(oboe::AudioFormat::Float);
                  b.setChannelCount(oboe::ChannelCount::Stereo);
                  b.setSampleRate(48000);
                  b.setDataCallback(this);
                  b.setErrorCallback(this);
                  oboe::Result r = b.openStream(mStream);
                  if (r != oboe::Result::OK) return false;
                  mStream->requestStart();
                  return true;
              }

              void stop() { if (mStream) { mStream->requestStop(); mStream->close(); } }

              struct Deck { std::vector<float> buffer; size_t pos = 0; float volume = 1.0f; bool active = false; };

              void loadDeck(int id, const float* data, size_t n, float vol) {
                  std::lock_guard<std::mutex> lock(mMutex);
                  if (id >= (int)mDecks.size()) mDecks.resize(id+1);
                  mDecks[id].buffer.assign(data, data+n);
                  mDecks[id].pos = 0; mDecks[id].volume = vol; mDecks[id].active = true;
              }

              void setDeckVolume(int id, float v) {
                  std::lock_guard<std::mutex> lock(mMutex);
                  if (id < (int)mDecks.size()) mDecks[id].volume = v;
              }

              void scratchDeck(int id, float rate) {
                  std::lock_guard<std::mutex> lock(mMutex);
                  if (id < (int)mDecks.size()) {
                      // rate<1 = slower, rate>1 = faster; pos advance is controlled per callback
                      mDecks[id].volume = std::abs(rate);
                  }
              }

          private:
              std::shared_ptr<oboe::AudioStream> mStream;
              std::vector<Deck> mDecks;
              std::mutex mMutex;
          };

          static OboeEngine* gEngine = nullptr;

          extern "C" {
              JNIEXPORT jboolean JNICALL
              Java_com_djpro_native_NativeBridge_startEngine(JNIEnv*, jobject) {
                  if (!gEngine) gEngine = new OboeEngine();
                  return gEngine->start();
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_native_NativeBridge_stopEngine(JNIEnv*, jobject) {
                  if (gEngine) { gEngine->stop(); delete gEngine; gEngine = nullptr; }
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_native_NativeBridge_loadDeck(JNIEnv* env, jobject,
                                                          jint id, jfloatArray data, jfloat vol) {
                  jsize n = env->GetArrayLength(data);
                  jfloat* buf = env->GetFloatArrayElements(data, nullptr);
                  if (gEngine) gEngine->loadDeck(id, buf, n, vol);
                  env->ReleaseFloatArrayElements(data, buf, 0);
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_native_NativeBridge_setDeckVolume(JNIEnv*, jobject, jint id, jfloat v) {
                  if (gEngine) gEngine->setDeckVolume(id, v);
              }
          }
          EOF

      - name: native DemucsBridge.cpp
        run: |
          cat > native/src/main/cpp/demucs/DemucsBridge.cpp << 'EOF'
          // Placeholder for Demucs NDK integration.
          // Real implementation: build demucs.cpp from source and link htdemucs model.
          // See https://github.com/sevagh/demucs.cpp for reference.
          #include <jni.h>
          #include <android/log.h>

          #define LOG_TAG "DJProDemucs"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" {
              JNIEXPORT jboolean JNICALL
              Java_com_djpro_native_DemucsBridge_isModelReady(JNIEnv*, jobject) {
                  return false;  // flip to true once model is bundled
              }
              JNIEXPORT jstring JNICALL
              Java_com_djpro_native_DemucsBridge_separate(JNIEnv* env, jobject, jstring path) {
                  LOGI("Stem separation stub called");
                  return env->NewStringUTF("not_implemented");
              }
          }
          EOF

      - name: NativeBridge.kt
        run: |
          cat > native/src/main/java/com/djpro/native/NativeBridge.kt << 'EOF'
          package com.djpro.native

          object NativeBridge {
              init { System.loadLibrary("djpro_native") }

              external fun startEngine(): Boolean
              external fun stopEngine()
              external fun loadDeck(id: Int, data: FloatArray, volume: Float)
              external fun setDeckVolume(id: Int, volume: Float)
              external fun scratchDeck(id: Int, rate: Float)
          }

          object DemucsBridge {
              external fun isModelReady(): Boolean
              external fun separate(path: String): String
