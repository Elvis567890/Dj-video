name: Build DJ Pro Mixer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean stale files
        run: |
          rm -rf app core-audio core-dsp core-stems core-video core-db native
          rm -f settings.gradle.kts build.gradle.kts gradle.properties
          rm -rf gradle .gradle .cxx
          find . -name "*.gradle.kts" -not -path "./.git/*" -delete 2>/dev/null || true

      - name: Create directories
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/djpro/mixer/audio
          mkdir -p app/src/main/java/com/djpro/mixer/dsp
          mkdir -p app/src/main/java/com/djpro/mixer/video
          mkdir -p app/src/main/java/com/djpro/mixer/ui
          mkdir -p app/src/main/java/com/djpro/mixer/stems
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values

      - name: Download HT-Demucs ONNX model
        run: |
          wget -q --show-progress -O app/src/main/assets/htdemucs.onnx \
            "https://huggingface.co/chinedudave06/demucs-onnx/resolve/main/htdemucs.onnx" || \
          wget -q --show-progress -O app/src/main/assets/htdemucs.onnx \
            "https://huggingface.co/adowu/htdemucs-onnx/resolve/main/htdemucs.onnx" || \
          echo "DOWNLOAD_FAILED"
          ls -lh app/src/main/assets/ || true

      - name: Root gradle files
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DJProMixer"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.parallel=true
          android.bundle.enableUncompressedNativeLibs=false
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.djpro.mixer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.djpro.mixer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 14
                  versionName = "6.0.0"
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      packaging { resources { excludes += "/META-INF/{AL2.0,LGPL2.1}" } }
                  }
                  debug { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-Xjvm-default=all")
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "/META-INF/DEPENDENCIES"
                      excludes += "/META-INF/LICENSE*"
                      excludes += "/META-INF/NOTICE*"
                  }
                  jniLibs { useLegacyPackaging = false }
              }
              androidResources {
                  noCompress += listOf("onnx")
              }
              lint { abortOnError = false; checkReleaseBuilds = false }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-common:1.4.1")
              implementation("com.microsoft.onnxruntime:onnxruntime-android:1.17.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

      - name: Manifest + resources
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="DJ Pro Mixer"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:extractNativeLibs="true"
                  android:theme="@style/Theme.DJPro"
                  tools:ignore="GoogleAppIndexingWarning,UnusedAttribute">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      tools:ignore="LockedOrientationActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".video.RecordingService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone"
                      tools:ignore="ForegroundServicePermission" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.DJPro" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#05050A</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">DJ Pro Mixer</string></resources>
          EOF

      - name: DSP files
        run: |
          cat > app/src/main/java/com/djpro/mixer/dsp/EchoAudioProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class EchoAudioProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var mix: Float = 0.35f
              private var delayBuffer = ShortArray(0)
              private var writePos = 0
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  val samples = (inputFormat.sampleRate * 0.28f).toInt().coerceAtLeast(1)
                  delayBuffer = ShortArray(samples * inputFormat.channelCount); writePos = 0
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled || delayBuffer.isEmpty()) out.put(inputBuffer)
                  else while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short; val d = delayBuffer[writePos]
                      val mixed = (s + (d * mix).toInt()).coerceIn(-32768, 32767).toShort()
                      delayBuffer[writePos] = s; out.putShort(mixed)
                      writePos = (writePos + 1) % delayBuffer.size
                  }
                  out.flip()
              }
              override fun onFlush() { delayBuffer.fill(0); writePos = 0 }
              override fun onReset() { delayBuffer = ShortArray(0) }
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/FilterAudioProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class FilterAudioProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var depth: Float = 0.15f
              private var prev = FloatArray(2)
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  prev = FloatArray(inputFormat.channelCount); return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val ch = prev.size; var i = 0
                  val a = depth.coerceIn(0.01f, 1f)
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f
                      val c = i % ch
                      val filtered = if (enabled) { val y = a * s + (1 - a) * prev[c]; prev[c] = y; y } else s
                      out.putShort((filtered * 32767f).coerceIn(-32768f, 32767f).toInt().toShort()); i++
                  }
                  out.flip()
              }
              override fun onFlush() { prev.fill(0f) }
              override fun onReset() { prev = FloatArray(2) }
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/VocalRemovalProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class VocalRemovalProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled) out.put(inputBuffer)
                  else {
                      while (inputBuffer.remaining() >= 4) {
                          val l = inputBuffer.short.toInt(); val r = inputBuffer.short.toInt()
                          val side = (l - r) / 2
                          out.putShort((side * 2).coerceIn(-32768, 32767).toShort())
                          out.putShort((-side * 2).coerceIn(-32768, 32767).toShort())
                      }
                      while (inputBuffer.remaining() > 0) out.put(inputBuffer.get())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/EqProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import kotlin.math.pow
          class EqProcessor : BaseAudioProcessor() {
              @Volatile var lowGainDb = 0f
              @Volatile var midGainDb = 0f
              @Volatile var highGainDb = 0f
              private var channels = 2
              private var lowPrev = FloatArray(2)
              private var hpPrevIn = FloatArray(2)
              private var hpPrevOut = FloatArray(2)
              private var lpCoeff = 0f
              private var hpCoeff = 0f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  channels = inputFormat.channelCount
                  lowPrev = FloatArray(channels); hpPrevIn = FloatArray(channels); hpPrevOut = FloatArray(channels)
                  val dt = 1f / inputFormat.sampleRate
                  val rcLp = 1f / (2f * Math.PI.toFloat() * 200f); lpCoeff = dt / (rcLp + dt)
                  val rcHp = 1f / (2f * Math.PI.toFloat() * 4000f); hpCoeff = rcHp / (rcHp + dt)
                  return inputFormat
              }
              private fun dbToLin(db: Float) = if (db == 0f) 1f else 10f.pow(db / 20f)
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val ch = channels; var i = 0
                  val lg = dbToLin(lowGainDb); val mg = dbToLin(midGainDb); val hg = dbToLin(highGainDb)
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f; val c = i % ch
                      lowPrev[c] += lpCoeff * (s - lowPrev[c]); val low = lowPrev[c]
                      hpPrevOut[c] = hpCoeff * (hpPrevOut[c] + s - hpPrevIn[c]); hpPrevIn[c] = s; val high = hpPrevOut[c]
                      val mid = s - low - high
                      val y = (low * lg + mid * mg + high * hg).coerceIn(-1f, 1f)
                      out.putShort((y * 32767f).toInt().toShort()); i++
                  }
                  out.flip()
              }
              override fun onFlush() { lowPrev.fill(0f); hpPrevIn.fill(0f); hpPrevOut.fill(0f) }
              override fun onReset() { lowPrev = FloatArray(2); hpPrevIn = FloatArray(2); hpPrevOut = FloatArray(2) }
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/MasterLimiterProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import kotlin.math.tanh
          class MasterLimiterProcessor : BaseAudioProcessor() {
              @Volatile var ceiling: Float = 0.92f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f
                      val limited = tanh(s).toFloat() * ceiling
                      out.putShort((limited * 32767f).toInt().toShort())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

      - name: FFT implementation
        run: |
          cat > app/src/main/java/com/djpro/mixer/stems/Fft.kt << 'EOF'
          package com.djpro.mixer.stems
          import kotlin.math.cos
          import kotlin.math.sin

          /**
           * Minimal Cooley-Tukey radix-2 FFT.
           * Requires input size to be a power of two.
           */
          object Fft {

              fun fft(re: FloatArray, im: FloatArray, invert: Boolean = false) {
                  val n = re.size
                  require(n == im.size && Integer.bitCount(n) == 1) { "FFT size must be a power of two" }

                  // Bit-reversal permutation
                  var j = 0
                  for (i in 1 until n) {
                      var bit = n shr 1
                      while (j and bit != 0) { j = j xor bit; bit = bit shr 1 }
                      j = j or bit
                      if (i < j) {
                          val tr = re[i]; re[i] = re[j]; re[j] = tr
                          val ti = im[i]; im[i] = im[j]; im[j] = ti
                      }
                  }

                  // Butterflies
                  var len = 2
                  while (len <= n) {
                      val ang = 2.0 * Math.PI / len * (if (invert) 1 else -1)
                      val wRe = cos(ang).toFloat()
                      val wIm = sin(ang).toFloat()
                      var i = 0
                      while (i < n) {
                          var curRe = 1f
                          var curIm = 0f
                          for (k in 0 until len / 2) {
                              val uRe = re[i + k]
                              val uIm = im[i + k]
                              val vRe = re[i + k + len / 2] * curRe - im[i + k + len / 2] * curIm
                              val vIm = re[i + k + len / 2] * curIm + im[i + k + len / 2] * curRe
                              re[i + k] = uRe + vRe
                              im[i + k] = uIm + vIm
                              re[i + k + len / 2] = uRe - vRe
                              im[i + k + len / 2] = uIm - vIm
                              val newCurRe = curRe * wRe - curIm * wIm
                              curIm = curRe * wIm + curIm * wRe
                              curRe = newCurRe
                          }
                          i += len
                      }
                      len = len shl 1
                  }

                  if (invert) {
                      for (i in 0 until n) { re[i] /= n; im[i] /= n }
                  }
              }

              fun hannWindow(size: Int): FloatArray = FloatArray(size) { i ->
                  (0.5 * (1.0 - cos(2.0 * Math.PI * i / (size - 1)))).toFloat()
              }
          }
          EOF

      - name: StemSeparator.kt (the AI engine)
        run: |
          cat > app/src/main/java/com/djpro/mixer/stems/StemSeparator.kt << 'EOF'
          package com.djpro.mixer.stems

          import ai.onnxruntime.OnnxTensor
          import ai.onnxruntime.OrtEnvironment
          import ai.onnxruntime.OrtSession
          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.nio.FloatBuffer
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.abs
          import kotlin.math.sqrt

          /**
           * Simplified on-device stem separation using an ONNX Runtime model.
           *
           * This implementation performs the STFT/ISTFT pipeline in Kotlin:
           *   1. Convert PCM FloatArray (stereo interleaved) -> magnitude spectrogram
           *   2. Feed magnitude spectrogram to the ONNX model
           *   3. Model returns 4 masked spectrograms (vocals/drums/bass/other)
           *   4. ISTFT each mask back to waveform and mix to stereo
           *
           * The model file `htdemucs.onnx` is loaded from app assets.
           */
          class StemSeparator(private val context: Context) {

              data class Stems(
                  val vocals: FloatArray,   // stereo interleaved
                  val drums: FloatArray,
                  val bass: FloatArray,
                  val other: FloatArray,
                  val sampleRate: Int
              )

              private val env: OrtEnvironment = OrtEnvironment.getEnvironment()
              private var session: OrtSession? = null
              private var inputName: String = "input"
              private var outputNames: List<String> = listOf("vocals", "drums", "bass", "other")
              var isReady: Boolean = false; private set

              private val nFft = 4096
              private val hop = 1024
              private val window = Fft.hannWindow(nFft)

              suspend fun loadModel(): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val bytes = context.assets.open("htdemucs.onnx").use { it.readBytes() }
                      val opts = OrtSession.SessionOptions().apply {
                          setIntraOpNumThreads(2)
                      }
                      session = env.createSession(bytes, opts)
                      inputName = session?.inputNames?.firstOrNull() ?: "input"
                      val outs = session?.outputNames?.toList() ?: emptyList()
                      if (outs.isNotEmpty()) outputNames = outs
                      isReady = true
                      true
                  } catch (t: Throwable) {
                      isReady = false
                      false
                  }
              }

              /**
               * Run separation on a stereo interleaved float buffer.
               * samples: FloatArray with L,R,L,R,... at given sampleRate.
               */
              suspend fun separate(samples: FloatArray, sampleRate: Int): Stems? = withContext(Dispatchers.Default) {
                  val sess = session ?: return@withContext null
                  if (samples.size < nFft * 2) return@withContext null

                  try {
                      val numSamples = samples.size / 2
                      val left = FloatArray(numSamples)
                      val right = FloatArray(numSamples)
                      for (i in 0 until numSamples) {
                          left[i] = samples[i * 2]
                          right[i] = samples[i * 2 + 1]
                      }

                      // Resample to 44100 if needed (naive linear)
                      val targetSr = 44100
                      val (l44, r44) = if (sampleRate != targetSr) {
                          val ratio = targetSr.toDouble() / sampleRate
                          val outLen = (numSamples * ratio).toInt()
                          val lo = FloatArray(outLen); val ro = FloatArray(outLen)
                          for (i in 0 until outLen) {
                              val src = i / ratio
                              val i0 = src.toInt().coerceIn(0, numSamples - 1)
                              val i1 = (i0 + 1).coerceAtMost(numSamples - 1)
                              val t = (src - i0).toFloat()
                              lo[i] = left[i0] * (1 - t) + left[i1] * t
                              ro[i] = right[i0] * (1 - t) + right[i1] * t
                          }
                          lo to ro
                      } else left to right

                      // STFT
                      val numFrames = 1 + (l44.size - nFft) / hop
                      if (numFrames <= 0) return@withContext null
                      val numBins = nFft / 2 + 1

                      val magL = Array(numFrames) { FloatArray(numBins) }
                      val magR = Array(numFrames) { FloatArray(numBins) }
                      val phaseL = Array(numFrames) { FloatArray(numBins) }
                      val phaseR = Array(numFrames) { FloatArray(numBins) }

                      for (f in 0 until numFrames) {
                          val reL = FloatArray(nFft); val imL = FloatArray(nFft)
                          val reR = FloatArray(nFft); val imR = FloatArray(nFft)
                          val start = f * hop
                          for (i in 0 until nFft) {
                              val w = window[i]
                              reL[i] = l44[start + i] * w
                              reR[i] = r44[start + i] * w
                          }
                          Fft.fft(reL, imL, false)
                          Fft.fft(reR, imR, false)
                          for (b in 0 until numBins) {
                              val ml = sqrt(reL[b] * reL[b] + imL[b] * imL[b])
                              val mr = sqrt(reR[b] * reR[b] + imR[b] * imR[b])
                              magL[f][b] = ml
                              magR[f][b] = mr
                              phaseL[f][b] = kotlin.math.atan2(imL[b], reL[b])
                              phaseR[f][b] = kotlin.math.atan2(imR[b], reR[b])
                          }
                      }

                      // Build model input: (1, 2, numBins, numFrames)
                      val inputFloats = FloatArray(2 * numBins * numFrames)
                      var idx = 0
                      for (b in 0 until numBins) for (f in 0 until numFrames) inputFloats[idx++] = magL[f][b]
                      for (b in 0 until numBins) for (f in 0 until numFrames) inputFloats[idx++] = magR[f][b]

                      val shape = longArrayOf(1, 2, numBins.toLong(), numFrames.toLong())
                      val tensor = OnnxTensor.createTensor(
                          env,
                          FloatBuffer.wrap(inputFloats),
                          shape
                      )

                      val inputs = mapOf(inputName to tensor)
                      val result = sess.run(inputs)

                      // Model is expected to output 4 tensors each (1, 2, numBins, numFrames)
                      // If output shape differs, we fall back to mid/side split.
                      val stemMasks = mutableListOf<FloatArray>()
                      for (i in outputNames.indices) {
                          try {
                              val t = result.get(i) as? OnnxTensor ?: break
                              val buf = t.floatBuffer
                              val arr = FloatArray(buf.remaining())
                              buf.get(arr)
                              stemMasks.add(arr)
                          } catch (_: Throwable) { break }
                      }

                      val karaoke = FloatArray(l44.size * 2)
                      // If model produced >= 3 masks (vocals, drums, bass), sum non-vocal for karaoke
                      // Otherwise, use mid/side removal as fallback
                      if (stemMasks.size >= 4 && stemMasks[0].size == 2 * numBins * numFrames) {
                          // Sum drums + bass + other masks
                          val sumMasks = FloatArray(2 * numBins * numFrames)
                          for (stem in 1 until 4) {
                              val m = stemMasks[stem]
                              for (k in sumMasks.indices) sumMasks[k] += m[k]
                          }
                          // Reconstruct karaoke via ISTFT using magnitude = mask * original
                          val reconL = istftFromMask(sumMasks, numBins, numFrames, 0, phaseL)
                          val reconR = istftFromMask(sumMasks, numBins, numFrames, 1, phaseR)
                          for (i in reconL.indices) {
                              val s = if (i < karaoke.size / 2) i else i
                              if (i * 2 + 1 < karaoke.size) {
                                  karaoke[i * 2] = reconL[i].coerceIn(-1f, 1f)
                                  karaoke[i * 2 + 1] = reconR[i].coerceIn(-1f, 1f)
                              }
                          }
                      } else {
                          // Fallback: mid/side
                          for (i in 0 until numSamples) {
                              val l = left[i]; val r = right[i]
                              val side = (l - r) * 0.5f
                              karaoke[i * 2] = side * 2f
                              karaoke[i * 2 + 1] = -side * 2f
                          }
                      }

                      tensor.close()
                      result.close()

                      // We return karaoke as the "vocals removed" track
                      Stems(
                          vocals = FloatArray(0),
                          drums = karaoke,
                          bass = FloatArray(0),
                          other = FloatArray(0),
                          sampleRate = sampleRate
                      )
                  } catch (t: Throwable) {
                      null
                  }
              }

              private fun istftFromMask(
                  masks: FloatArray,
                  numBins: Int,
                  numFrames: Int,
                  channel: Int,
                  phases: Array<FloatArray>
              ): FloatArray {
                  val outLen = (numFrames - 1) * hop + nFft
                  val out = FloatArray(outLen)
                  val winSum = FloatArray(outLen)
                  val re = FloatArray(nFft); val im = FloatArray(nFft)
                  for (f in 0 until numFrames) {
                      java.util.Arrays.fill(re, 0f)
                      java.util.Arrays.fill(im, 0f)
                      for (b in 0 until numBins) {
                          val maskIdx = channel * (numBins * numFrames) + b * numFrames + f
                          val mag = masks[maskIdx]
                          val ph = phases[f][b]
                          re[b] = mag * kotlin.math.cos(ph)
                          im[b] = mag * kotlin.math.sin(ph)
                          if (b > 0 && b < numBins - 1) {
                              val bMirror = nFft - b
                              re[bMirror] = re[b]
                              im[bMirror] = -im[b]
                          }
                      }
                      Fft.fft(re, im, true)
                      val start = f * hop
                      for (i in 0 until nFft) {
                          out[start + i] += re[i] * window[i]
                          winSum[start + i] += window[i] * window[i]
                      }
                  }
                  for (i in out.indices) {
                      if (winSum[i] > 1e-6f) out[i] /= winSum[i]
                  }
                  return out
              }

              fun release() {
                  try { session?.close() } catch (_: Throwable) {}
                  try { env.close() } catch (_: Throwable) {}
              }
          }
          EOF

      - name: DeckPlayer.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/DeckPlayer.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import com.djpro.mixer.dsp.EchoAudioProcessor
          import com.djpro.mixer.dsp.EqProcessor
          import com.djpro.mixer.dsp.FilterAudioProcessor
          import com.djpro.mixer.dsp.MasterLimiterProcessor
          import com.djpro.mixer.dsp.VocalRemovalProcessor
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          class DeckPlayer(val index: Int, context: Context) {
              val echo = EchoAudioProcessor()
              val filter = FilterAudioProcessor()
              val vocal = VocalRemovalProcessor()
              val eq = EqProcessor()
              val limiter = MasterLimiterProcessor()
              private val audioSink: AudioSink = DefaultAudioSink.Builder()
                  .setAudioProcessors(arrayOf<AudioProcessor>(eq, echo, filter, vocal, limiter)).build()
              private val renderersFactory = object : DefaultRenderersFactory(context) {
                  override fun buildAudioSink(context: Context, enableFloatOutput: Boolean,
                                              enableAudioTrackPlaybackParams: Boolean): AudioSink = audioSink
              }
              val player: ExoPlayer = ExoPlayer.Builder(context, renderersFactory).build().apply {
                  repeatMode = Player.REPEAT_MODE_OFF; playWhenReady = false; volume = 1f
              }
              var isLoaded by mutableStateOf(false); private set
              var isPlaying by mutableStateOf(false); private set
              var scratching by mutableStateOf(false); private set
              var scratchRate by mutableFloatStateOf(1f); private set
              var scratchVelocity by mutableFloatStateOf(0f); private set
              var bpm: Float = 128f; private set
              var loadedName: String = ""; private set
              var localFilePath: String? = null; private set
              val cuePoints = LongArray(8) { -1L }
              var loopActive by mutableStateOf(false); private set
              var loopBeats = 4; private set
              var loopStartMs = 0L; private set
              var loopEndMs = 0L; private set
              private var scratchStartMs = 0L
              private var scratchAccumMs = 0L
              private var wasPlayingBeforeScratch = false
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var effectJob: Job? = null
              private var loopJob: Job? = null

              fun load(uri: String, displayName: String = "Loaded", path: String? = null) {
                  try {
                      player.setMediaItem(MediaItem.fromUri(uri)); player.prepare()
                      isLoaded = true; bpm = 120f + (0..16).random(); loadedName = displayName
                      localFilePath = path
                  } catch (_: Throwable) { isLoaded = false }
              }
              fun play() { try { player.play(); isPlaying = true } catch (_: Throwable) {} }
              fun pause() { try { player.pause(); isPlaying = false } catch (_: Throwable) {} }
              fun toggle() { if (isPlaying) pause() else play() }
              fun setVolume(v: Float) { try { player.volume = v.coerceIn(0f, 1f) } catch (_: Throwable) {} }
              fun currentSpeed(): Float = try { player.playbackParameters.speed } catch (_: Throwable) { 1f }

              fun beginScratch() {
                  try {
                      wasPlayingBeforeScratch = player.isPlaying
                      scratching = true
                      scratchStartMs = player.currentPosition; scratchAccumMs = 0L
                      scratchRate = 0f; scratchVelocity = 0f
                      player.pause()
                  } catch (_: Throwable) {}
              }
              fun scratchMove(deltaPixels: Float) {
                  try {
                      val msPerPixel = 5f
                      scratchAccumMs += (-deltaPixels * msPerPixel).toLong()
                      val dur = player.duration.takeIf { it > 0 } ?: Long.MAX_VALUE
                      val target = (scratchStartMs + scratchAccumMs).coerceIn(0L, dur)
                      player.seekTo(target)
                      val instantRate = (-deltaPixels / 15f).coerceIn(-3f, 3f)
                      scratchRate = instantRate; scratchVelocity = instantRate
                  } catch (_: Throwable) {}
              }
              fun endScratch() {
                  try {
                      val inertiaMs = (scratchAccumMs * 0.20f).toLong()
                      val dur = player.duration.takeIf { it > 0 } ?: Long.MAX_VALUE
                      val finalPos = (scratchStartMs + scratchAccumMs + inertiaMs).coerceIn(0L, dur)
                      player.seekTo(finalPos)
                      if (wasPlayingBeforeScratch) player.play()
                      scratching = false; scratchRate = 1f; scratchVelocity = 0f
                  } catch (_: Throwable) { scratching = false }
              }
              fun spinback() {
                  effectJob?.cancel()
                  effectJob = scope.launch {
                      try {
                          val wasPlaying = player.isPlaying
                          scratching = true
                          val startMs = player.currentPosition
                          val rewindMs = 900L; val steps = 18; val stepBack = rewindMs / steps
                          for (i in 0 until steps) {
                              player.seekTo((startMs - i * stepBack).coerceAtLeast(0L))
                              scratchRate = -3f; scratchVelocity = -3f; delay(18)
                          }
                          scratchRate = 1f; scratchVelocity = 0f; scratching = false
                          if (wasPlaying) player.play()
                      } catch (_: Throwable) { scratching = false }
                  }
              }
              fun brake() {
                  effectJob?.cancel()
                  effectJob = scope.launch {
                      try {
                          scratching = true
                          var speed = player.playbackParameters.speed
                          if (speed <= 0.05f) speed = 1f
                          val step = (speed - 0.05f) / 14f
                          for (i in 0 until 14) {
                              speed -= step; player.setPlaybackSpeed(speed.coerceAtLeast(0.05f))
                              scratchRate = speed; scratchVelocity = speed - 1f; delay(35)
                          }
                          player.pause(); player.setPlaybackSpeed(1f)
                          scratchRate = 1f; scratchVelocity = 0f
                      } catch (_: Throwable) {}
                      scratching = false
                  }
              }
              fun setCue(slot: Int) { if (slot in 0..7) cuePoints[slot] = positionMs() }
              fun jumpToCue(slot: Int) {
                  if (slot !in 0..7) return
                  val t = cuePoints[slot]; if (t >= 0) try { player.seekTo(t) } catch (_: Throwable) {}
              }
              fun toggleLoop(beats: Int = loopBeats) { loopBeats = beats; if (loopActive) stopLoop() else startLoop(beats) }
              private fun startLoop(beats: Int) {
                  try {
                      val beatMs = if (bpm > 0) (60000f / bpm).toLong() else 500L
                      val loopLen = beatMs * beats; val start = positionMs()
                      loopStartMs = start; loopEndMs = start + loopLen; loopActive = true
                      loopJob?.cancel(); loopJob = scope.launch {
                          while (loopActive) {
                              try { if (player.currentPosition >= loopEndMs) player.seekTo(loopStartMs) } catch (_: Throwable) {}
                              delay(30)
                          }
                      }
                  } catch (_: Throwable) {}
              }
              fun stopLoop() { loopActive = false; loopJob?.cancel(); loopJob = null }
              fun positionMs(): Long = try { player.currentPosition } catch (_: Throwable) { 0L }
              fun durationMs(): Long = try { val d = player.duration; if (d > 0) d else 0L } catch (_: Throwable) { 0L }
              fun release() {
                  effectJob?.cancel(); loopJob?.cancel()
                  try { player.release() } catch (_: Throwable) {}
                  try { audioSink.release() } catch (_: Throwable) {}
              }
          }
          EOF

      - name: AudioEngine.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/AudioEngine.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.content.Context
          import kotlin.math.cos
          import kotlin.math.sin
          enum class CrossfaderMode { CUT, FADE }
          class AudioEngine(context: Context) {
              val decks: List<DeckPlayer> = (0 until 6).map { DeckPlayer(it, context) }
              var crossfader: Float = 0.5f; private set
              var crossfaderMode: CrossfaderMode = CrossfaderMode.FADE; private set
              var masterVolume: Float = 1.0f; private set
              var activeDeckA: Int = 0; private set
              var activeDeckB: Int = 1; private set
              var echoEnabled = false; var filterEnabled = false; var vocalRemovalEnabled = false
              var stemDrumsMuted = false; var stemBassMuted = false; var stemOtherMuted = false
              val history = mutableListOf<String>()
              init { setCrossfader(0.5f); setMasterVolume(1.0f) }
              fun swapToA(deckId: Int) { if (deckId in decks.indices && deckId != activeDeckB) { activeDeckA = deckId; applyCrossfader() } }
              fun swapToB(deckId: Int) { if (deckId in decks.indices && deckId != activeDeckB && deckId != activeDeckA) { activeDeckB = deckId; applyCrossfader() } }
              fun deckA(): DeckPlayer = decks[activeDeckA]
              fun deckB(): DeckPlayer = decks[activeDeckB]
              fun setCrossfader(v: Float) { crossfader = v.coerceIn(0f, 1f); applyCrossfader() }
              fun setCrossfaderMode(m: CrossfaderMode) { crossfaderMode = m; applyCrossfader() }
              private fun applyCrossfader() {
                  val (a, b) = when (crossfaderMode) {
                      CrossfaderMode.FADE -> cos(crossfader * Math.PI / 2).toFloat() to sin(crossfader * Math.PI / 2).toFloat()
                      CrossfaderMode.CUT -> {
                          val zone = 0.05f
                          when {
                              crossfader < 0.5f - zone -> 1f to 0f
                              crossfader > 0.5f + zone -> 0f to 1f
                              else -> { val t = (crossfader - (0.5f - zone)) / (2 * zone); 1f - t to t }
                          }
                      }
                  }
                  decks[activeDeckA].setVolume(a * masterVolume)
                  decks[activeDeckB].setVolume(b * masterVolume)
              }
              fun setMasterVolume(v: Float) { masterVolume = v.coerceIn(0f, 1f); applyCrossfader() }
              fun setEcho(on: Boolean) { echoEnabled = on; decks.forEach { it.echo.enabled = on } }
              fun setFilter(on: Boolean) { filterEnabled = on; decks.forEach { it.filter.enabled = on } }
              fun setVocalRemoval(on: Boolean) { vocalRemovalEnabled = on; decks.forEach { it.vocal.enabled = on } }
              fun setStemMutes(drums: Boolean, bass: Boolean, other: Boolean) {
                  stemDrumsMuted = drums; stemBassMuted = bass; stemOtherMuted = other
                  val lowDb = if (bass) -26f else if (drums) -12f else 0f
                  val highDb = if (other) -26f else 0f
                  decks.forEach { it.eq.lowGainDb = lowDb; it.eq.highGainDb = highDb }
              }
              fun setEq(index: Int, low: Float, mid: Float, high: Float) {
                  if (index !in decks.indices) return
                  val d = decks[index]
                  d.eq.lowGainDb = low.coerceIn(-26f, 6f)
                  d.eq.midGainDb = mid.coerceIn(-26f, 6f)
                  d.eq.highGainDb = high.coerceIn(-26f, 6f)
              }
              fun syncBpm(sourceIndex: Int, targetIndex: Int) {
                  if (sourceIndex !in decks.indices || targetIndex !in decks.indices) return
                  val src = decks[sourceIndex].bpm; val tgt = decks[targetIndex].bpm
                  if (src <= 0f || tgt <= 0f) return
                  try { decks[targetIndex].player.setPlaybackSpeed((src / tgt).coerceIn(0.5f, 2f)) } catch (_: Throwable) {}
              }
              fun loadDeck(index: Int, uri: String, name: String = "Loaded", path: String? = null) {
                  if (index in decks.indices) {
                      decks[index].load(uri, name, path)
                      history.add(0, name); if (history.size > 20) history.removeAt(history.size - 1)
                  }
              }
              fun togglePlay(index: Int) { if (index in decks.indices) decks[index].toggle() }
              fun beginScratch(index: Int) { if (index in decks.indices) decks[index].beginScratch() }
              fun scratchMove(index: Int, dy: Float) { if (index in decks.indices) decks[index].scratchMove(dy) }
              fun endScratch(index: Int) { if (index in decks.indices) decks[index].endScratch() }
              fun spinback(index: Int) { if (index in decks.indices) decks[index].spinback() }
              fun brake(index: Int) { if (index in decks.indices) decks[index].brake() }
              fun setCue(index: Int, slot: Int) { if (index in decks.indices) decks[index].setCue(slot) }
              fun jumpCue(index: Int, slot: Int) { if (index in decks.indices) decks[index].jumpToCue(slot) }
              fun toggleLoop(index: Int, beats: Int) { if (index in decks.indices) decks[index].toggleLoop(beats) }
              fun release() { decks.forEach { it.release() } }
          }
          EOF

