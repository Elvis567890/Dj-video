          cat > app/src/main/java/com/ultimate/dj/video/MixRecorder.kt << 'EOF'
          package com.ultimate.dj.video
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.MediaRecorder
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import java.io.File
          class MixRecorder(private val context: Context) {
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var recorder: MediaRecorder? = null
              private var outputFile: File? = null
              var isRecording: Boolean = false; private set
              var lastSavedUri: Uri? = null; private set
              var lastSavedName: String = ""; private set
              fun buildIntent(): Intent? = try {
                  context.getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent()
              } catch (_: Throwable) { null }
              fun start(resultCode: Int, data: Intent): Boolean {
                  if (isRecording) return false
                  return try {
                      try { context.startForegroundService(Intent(context, RecordingService::class.java)) } catch (_: Throwable) {}
                      val mgr = context.getSystemService(MediaProjectionManager::class.java)
                      projection = mgr.getMediaProjection(resultCode, data)
                      val metrics = DisplayMetrics()
                      val wm = context.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      @Suppress("DEPRECATION") wm.defaultDisplay.getRealMetrics(metrics)
                      val w = metrics.widthPixels; val h = metrics.heightPixels; val dpi = metrics.densityDpi
                      val dir = context.getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: context.filesDir
                      outputFile = File(dir, "Ultimate_${System.currentTimeMillis()}.mp4")
                      val rec: MediaRecorder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) MediaRecorder(context)
                      else @Suppress("DEPRECATION") MediaRecorder()
                      rec.apply {
                          setVideoSource(MediaRecorder.VideoSource.SURFACE)
                          setAudioSource(MediaRecorder.AudioSource.MIC)
                          setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                          setVideoEncoder(MediaRecorder.VideoEncoder.H264)
                          setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                          setVideoSize(w, h); setVideoFrameRate(30); setVideoEncodingBitRate(8_000_000)
                          setOutputFile(outputFile!!.absolutePath); prepare()
                      }
                      recorder = rec
                      virtualDisplay = projection?.createVirtualDisplay(
                          "UltimateRec", w, h, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          rec.surface, null, null)
                      rec.start(); isRecording = true; true
                  } catch (_: Throwable) { false }
              }
              fun stop(): Uri? {
                  try { recorder?.stop() } catch (_: Throwable) {}
                  try { recorder?.release() } catch (_: Throwable) {}
                  recorder = null; isRecording = false
                  try { virtualDisplay?.release() } catch (_: Throwable) {}
                  virtualDisplay = null
                  try { projection?.stop() } catch (_: Throwable) {}
                  projection = null
                  try { context.stopService(Intent(context, RecordingService::class.java)) } catch (_: Throwable) {}
                  val raw = outputFile ?: return null
                  return saveToGallery(raw)
              }
              private fun saveToGallery(raw: File): Uri? {
                  return try {
                      val values = ContentValues().apply {
                          put(MediaStore.Video.Media.DISPLAY_NAME, raw.name)
                          put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/ULTIMATE")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }
                      }
                      val uri = context.contentResolver.insert(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return Uri.fromFile(raw)
                      context.contentResolver.openOutputStream(uri)?.use { out ->
                          raw.inputStream().use { it.copyTo(out) }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          values.clear()
                          values.put(MediaStore.Video.Media.IS_PENDING, 0)
                          context.contentResolver.update(uri, values, null, null)
                      }
                      raw.delete()
                      lastSavedUri = uri
                      lastSavedName = raw.name
                      uri
                  } catch (_: Throwable) { null }
              }
          }
          EOF

      - name: UI VideoDeckView
        run: |
          cat > app/src/main/java/com/ultimate/dj/ui/VideoDeckView.kt << 'EOF'
          package com.ultimate.dj.ui
          import android.view.ViewGroup
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clipToBounds
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import com.ultimate.dj.audio.DeckPlayer
          import kotlin.math.abs
          import kotlin.math.sin
          import kotlin.random.Random
          enum class VideoTransition { CROSSFADE, ZOOM, WIPE, SLIDE, FLIP, GLITCH, STROBE, SPIN, BURN }
          @Composable
          fun VideoDeckView(
              deck: DeckPlayer, progress: Float, isIncoming: Boolean,
              transition: VideoTransition = VideoTransition.CROSSFADE,
              accentColor: Color = Color.Cyan,
              showScratchOverlay: Boolean = true,
              modifier: Modifier = Modifier
          ) {
              val p = if (isIncoming) progress else (1f - progress)
              val t = 1f - abs(progress - 0.5f) * 2f
              val smoothP by animateFloatAsState(p, tween(80), label = "vp")
              val smoothT by animateFloatAsState(t, tween(120), label = "vt")
              var alpha = smoothP; var sx = 1f; var sy = 1f; var tx = 0f; var ty = 0f
              var rotY = 0f; var rotZ = 0f; var camDist = 12f
              when (transition) {
                  VideoTransition.CROSSFADE -> { alpha = smoothP }
                  VideoTransition.ZOOM -> { alpha = smoothP; val s = 0.80f + 0.20f * smoothP; sx = s; sy = s }
                  VideoTransition.WIPE -> { alpha = smoothP; if (isIncoming) tx = (1f - progress) * 3000f }
                  VideoTransition.SLIDE -> { alpha = if (p > 0.02f) 1f else 0f; tx = if (isIncoming) -(1f - progress) * 3000f else progress * 3000f }
                  VideoTransition.FLIP -> { rotY = if (isIncoming) (progress - 1f) * 180f else progress * 180f; alpha = if (abs(rotY) < 89f) 1f else 0f; camDist = 8f }
                  VideoTransition.GLITCH -> {
                      alpha = smoothP
                      val jitterAmp = smoothT * 32f
                      val rnd = Random((progress * 1000f).toInt() * 7919)
                      tx = (rnd.nextFloat() - 0.5f) * jitterAmp
                      ty = (rnd.nextFloat() - 0.5f) * jitterAmp * 0.35f
                      sx = 1f + smoothT * 0.04f * (rnd.nextFloat() - 0.5f)
                      sy = 1f + smoothT * 0.04f * (rnd.nextFloat() - 0.5f)
                  }
                  VideoTransition.STROBE -> {
                      val flick = if (smoothT > 0.02f) { val s = sin(progress * 95f); if (s > 0f) 1f else 0.15f } else 1f
                      alpha = smoothP * flick
                  }
                  VideoTransition.SPIN -> {
                      alpha = smoothP
                      val dir = if (isIncoming) 1f else -1f
                      rotZ = (1f - smoothP) * 360f * dir
                      val s = 0.55f + 0.45f * smoothP; sx = s; sy = s
                  }
                  VideoTransition.BURN -> { alpha = smoothP; val s = 1f + smoothT * 0.18f; sx = s; sy = s }
              }
              Box(modifier = modifier.clipToBounds()) {
                  AndroidView(
                      modifier = Modifier
                          .fillMaxSize()
                          .graphicsLayer {
                              this.alpha = alpha.coerceIn(0f, 1f)
                              scaleX = sx; scaleY = sy
                              translationX = tx; translationY = ty
                              rotationY = rotY; rotationZ = rotZ
                              cameraDistance = camDist * density
                          },
                      factory = { c ->
                          PlayerView(c).apply {
                              layoutParams = ViewGroup.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                              useController = false
                              setShowBuffering(PlayerView.SHOW_BUFFERING_NEVER)
                              resizeMode = AspectRatioFrameLayout.RESIZE_MODE_FIT
                              setShutterBackgroundColor(android.graphics.Color.BLACK)
                              player = deck.player
                          }
                      },
                      update = { view -> view.player = deck.player },
                      onRelease = { view -> view.player = null }
                  )
                  if (smoothT > 0.05f && alpha > 0.15f) {
                      when (transition) {
                          VideoTransition.GLITCH -> GlitchOverlay(accentColor, smoothT, progress)
                          VideoTransition.STROBE -> StrobeOverlay(accentColor, smoothT, progress)
                          VideoTransition.BURN -> BurnOverlay(accentColor, smoothT)
                          else -> {}
                      }
                  }
                  if (showScratchOverlay && deck.scratching && alpha > 0.3f) {
                      ScratchOverlay(accentColor, deck.scratchRate, deck.scratchVelocity,
                          Modifier.fillMaxSize().graphicsLayer { this.alpha = alpha.coerceIn(0f, 1f) })
                  }
              }
          }
          @Composable
          private fun GlitchOverlay(accent: Color, intensity: Float, progress: Float) {
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val w = size.width; val h = size.height
                  val rnd = Random((progress * 10000f).toInt() * 7919)
                  val bars = (8 + intensity * 22).toInt()
                  for (i in 0 until bars) {
                      val y = rnd.nextFloat() * h
                      val barH = 1f + rnd.nextFloat() * (2f + 10f * intensity)
                      val xOff = (rnd.nextFloat() - 0.5f) * 90f * intensity
                      val a = 0.20f + 0.55f * intensity * rnd.nextFloat()
                      val col = when (rnd.nextInt(3)) {
                          0 -> accent.copy(alpha = a)
                          1 -> Color(0xFFFF0044).copy(alpha = a * 0.8f)
                          else -> Color(0xFF00FF88).copy(alpha = a * 0.6f)
                      }
                      drawRect(color = col, topLeft = Offset(xOff, y), size = Size(w, barH))
                  }
              }
          }
          @Composable
          private fun StrobeOverlay(accent: Color, intensity: Float, progress: Float) {
              val flash = (sin(progress * 95f) * 0.5f + 0.5f).coerceIn(0f, 1f)
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val a = flash * intensity * 0.55f
                  drawRect(color = Color.White.copy(alpha = a))
                  drawRect(color = accent.copy(alpha = a * 0.35f))
              }
          }
          @Composable
          private fun BurnOverlay(accent: Color, intensity: Float) {
              Canvas(modifier = Modifier.fillMaxSize()) {
                  val w = size.width; val h = size.height
                  drawRect(color = Color(0xFFFF6A00).copy(alpha = 0.18f * intensity))
                  drawRect(color = Color.White.copy(alpha = 0.35f * intensity), topLeft = Offset(0f, h * 0.45f), size = Size(w, h * 0.1f))
              }
          }
          EOF

