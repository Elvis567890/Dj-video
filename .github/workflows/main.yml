      - name: BeatAnalyzer
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/BeatAnalyzer.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.abs
          object BeatAnalyzer {
              fun analyze(uri: String): Float {
                  return try {
                      val extractor = MediaExtractor()
                      extractor.setDataSource(uri)
                      var audioTrack = -1
                      for (i in 0 until extractor.trackCount) {
                          val fmt = extractor.getTrackFormat(i)
                          if (fmt.getString(MediaFormat.KEY_MIME)?.startsWith("audio/") == true) {
                              audioTrack = i; break
                          }
                      }
                      if (audioTrack < 0) { extractor.release(); return 120f }
                      extractor.selectTrack(audioTrack)
                      val buf = ByteBuffer.allocate(2048).order(ByteOrder.LITTLE_ENDIAN)
                      val energies = mutableListOf<Float>()
                      var reads = 0
                      while (energies.size < 400 && reads < 800) {
                          buf.clear()
                          val n = extractor.readSampleData(buf, 0)
                          if (n < 0) break
                          buf.position(0); buf.limit(n)
                          var sum = 0L
                          while (buf.remaining() >= 2) sum += abs(buf.short.toInt()).toLong()
                          energies.add(sum.toFloat())
                          reads++
                          extractor.advance()
                      }
                      extractor.release()
                      estimateBpm(energies)
                  } catch (_: Throwable) { 120f }
              }
              private fun estimateBpm(energies: List<Float>): Float {
                  if (energies.size < 20) return 120f
                  val mean = energies.average().toFloat()
                  val c = energies.map { it - mean }
                  var bestLag = 0; var bestScore = 0f
                  for (lag in 5..60) {
                      var score = 0f
                      for (i in 0 until c.size - lag) score += c[i] * c[i + lag]
                      if (score > bestScore) { bestScore = score; bestLag = lag }
                  }
                  if (bestLag == 0) return 120f
                  return ((60f * 200f) / bestLag).coerceIn(60f, 200f)
              }
          }
          EOF

      - name: DeckPlayer
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/DeckPlayer.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.common.Tracks
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import com.djpro.mixer.dsp.EchoAudioProcessor
          import com.djpro.mixer.dsp.EqProcessor
          import com.djpro.mixer.dsp.FilterAudioProcessor
          import com.djpro.mixer.dsp.KeyLockProcessor
          import com.djpro.mixer.dsp.MasterLimiterProcessor
          import com.djpro.mixer.dsp.VocalRemovalProcessor
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          class DeckPlayer(val index: Int, context: Context) {
              val echo = EchoAudioProcessor()
              val filter = FilterAudioProcessor()
              val vocal = VocalRemovalProcessor()
              val eq = EqProcessor()
              val limiter = MasterLimiterProcessor()
              val keyLock = KeyLockProcessor()
              private val audioSink: AudioSink = DefaultAudioSink.Builder()
                  .setAudioProcessors(arrayOf<AudioProcessor>(eq, echo, filter, vocal, keyLock, limiter)).build()
              private val renderersFactory = object : DefaultRenderersFactory(context) {
                  override fun buildAudioSink(context: Context, enableFloatOutput: Boolean,
                                              enableAudioTrackPlaybackParams: Boolean): AudioSink = audioSink
              }
              val player: ExoPlayer = ExoPlayer.Builder(context, renderersFactory).build().apply {
                  repeatMode = Player.REPEAT_MODE_OFF; playWhenReady = false; volume = 1f
              }
              var isLoaded by mutableStateOf(false); private set
              var isPlaying by mutableStateOf(false); private set
              var hasVideo by mutableStateOf(false); private set
              var scratching by mutableStateOf(false); private set
              var scratchRate by mutableFloatStateOf(1f); private set
              var scratchVelocity by mutableFloatStateOf(0f); private set
              var bpm: Float = 128f; private set
              var loadedName: String = ""; private set
              val cuePoints = LongArray(8) { -1L }
              var loopActive by mutableStateOf(false); private set
              var loopBeats = 4; private set
              var loopStartMs = 0L; private set
              var loopEndMs = 0L; private set
              private var scratchStartMs = 0L
              private var scratchAccumMs = 0L
              private var wasPlayingBeforeScratch = false
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var effectJob: Job? = null
              private var loopJob: Job? = null
              init {
                  player.addListener(object : Player.Listener {
                      override fun onTracksChanged(tracks: Tracks) {
                          var foundVideo = false
                          for (group in tracks.groups) {
                              if (group.type == C.TRACK_TYPE_VIDEO && group.isSupported) { foundVideo = true; break }
                          }
                          hasVideo = foundVideo
                      }
                      override fun onIsPlayingChanged(isPlayingNow: Boolean) { isPlaying = isPlayingNow }
                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_ENDED) isPlaying = false
                      }
                  })
              }
              fun load(uri: String, displayName: String = "Loaded") {
                  try {
                      hasVideo = false
                      player.setMediaItem(MediaItem.fromUri(uri)); player.prepare()
                      isLoaded = true; loadedName = displayName
                      scope.launch {
                          try { bpm = BeatAnalyzer.analyze(uri) } catch (_: Throwable) { bpm = 120f }
                      }
                  } catch (_: Throwable) { isLoaded = false }
              }
              fun play() { try { player.play(); isPlaying = true } catch (_: Throwable) {} }
              fun pause() { try { player.pause(); isPlaying = false } catch (_: Throwable) {} }
              fun toggle() { if (isPlaying) pause() else play() }
              fun setVolume(v: Float) { try { player.volume = v.coerceIn(0f, 1f) } catch (_: Throwable) {} }
              fun currentSpeed(): Float = try { player.playbackParameters.speed } catch (_: Throwable) { 1f }
              fun setSpeed(s: Float) { try { player.setPlaybackSpeed(s.coerceIn(0.25f, 4f)) } catch (_: Throwable) {} }
              fun setKeyLock(on: Boolean) { keyLock.enabled = on }
              fun beginScratch() {
                  try {
                      wasPlayingBeforeScratch = player.isPlaying
                      scratching = true
                      scratchStartMs = player.currentPosition; scratchAccumMs = 0L
                      scratchRate = 0f; scratchVelocity = 0f
                      player.pause()
                  } catch (_: Throwable) {}
              }
              fun scratchMove(deltaPixels: Float) {
                  try {
                      val msPerPixel = 5f
                      scratchAccumMs += (-deltaPixels * msPerPixel).toLong()
                      val dur = player.duration.takeIf { it > 0 } ?: Long.MAX_VALUE
                      val target = (scratchStartMs + scratchAccumMs).coerceIn(0L, dur)
                      player.seekTo(target)
                      val instantRate = (-deltaPixels / 15f).coerceIn(-3f, 3f)
                      scratchRate = instantRate; scratchVelocity = instantRate
                  } catch (_: Throwable) {}
              }
              fun endScratch() {
                  try {
                      val inertiaMs = (scratchAccumMs * 0.20f).toLong()
                      val dur = player.duration.takeIf { it > 0 } ?: Long.MAX_VALUE
                      val finalPos = (scratchStartMs + scratchAccumMs + inertiaMs).coerceIn(0L, dur)
                      player.seekTo(finalPos)
                      if (wasPlayingBeforeScratch) player.play()
                      scratching = false; scratchRate = 1f; scratchVelocity = 0f
                  } catch (_: Throwable) { scratching = false }
              }
              fun spinback() {
                  effectJob?.cancel()
                  effectJob = scope.launch {
                      try {
                          val wasPlaying = player.isPlaying
                          scratching = true
                          val startMs = player.currentPosition
                          val rewindMs = 900L; val steps = 18; val stepBack = rewindMs / steps
                          for (i in 0 until steps) {
                              player.seekTo((startMs - i * stepBack).coerceAtLeast(0L))
                              scratchRate = -3f; scratchVelocity = -3f; delay(18)
                          }
                          scratchRate = 1f; scratchVelocity = 0f; scratching = false
                          if (wasPlaying) player.play()
                      } catch (_: Throwable) { scratching = false }
                  }
              }
              fun brake() {
                  effectJob?.cancel()
                  effectJob = scope.launch {
                      try {
                          scratching = true
                          var speed = player.playbackParameters.speed
                          if (speed <= 0.05f) speed = 1f
                          val step = (speed - 0.05f) / 14f
                          for (i in 0 until 14) {
                              speed -= step; player.setPlaybackSpeed(speed.coerceAtLeast(0.05f))
                              scratchRate = speed; scratchVelocity = speed - 1f; delay(35)
                          }
                          player.pause(); player.setPlaybackSpeed(1f)
                          scratchRate = 1f; scratchVelocity = 0f
                      } catch (_: Throwable) {}
                      scratching = false
                  }
              }
              fun setCue(slot: Int) { if (slot in 0..7) cuePoints[slot] = positionMs() }
              fun jumpToCue(slot: Int) {
                  if (slot !in 0..7) return
                  val t = cuePoints[slot]; if (t >= 0) try { player.seekTo(t) } catch (_: Throwable) {}
              }
              fun toggleLoop(beats: Int = loopBeats) { loopBeats = beats; if (loopActive) stopLoop() else startLoop(beats) }
              private fun startLoop(beats: Int) {
                  try {
                      val beatMs = if (bpm > 0) (60000f / bpm).toLong() else 500L
                      val loopLen = beatMs * beats; val start = positionMs()
                      loopStartMs = start; loopEndMs = start + loopLen; loopActive = true
                      loopJob?.cancel(); loopJob = scope.launch {
                          while (loopActive) {
                              try { if (player.currentPosition >= loopEndMs) player.seekTo(loopStartMs) } catch (_: Throwable) {}
                              delay(30)
                          }
                      }
                  } catch (_: Throwable) {}
              }
              fun stopLoop() { loopActive = false; loopJob?.cancel(); loopJob = null }
              fun positionMs(): Long = try { player.currentPosition } catch (_: Throwable) { 0L }
              fun durationMs(): Long = try { val d = player.duration; if (d > 0) d else 0L } catch (_: Throwable) { 0L }
              fun release() {
                  effectJob?.cancel(); loopJob?.cancel(); scope.cancel()
                  try { player.release() } catch (_: Throwable) {}
                  try { audioSink.release() } catch (_: Throwable) {}
              }
          }
          EOF

      - name: SampleSynth
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/SampleSynth.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import kotlin.math.PI
          import kotlin.math.exp
          import kotlin.math.pow
          import kotlin.math.sin
          import kotlin.random.Random
          object SampleSynth {
              private const val SR = 44100
              private val scope = CoroutineScope(Dispatchers.Default + Job())
              private fun toShort(v: Double): Short = (v.coerceIn(-1.0, 1.0) * 32000.0).toInt().coerceIn(-32768, 32767).toShort()
              private fun makeKick(): ShortArray {
                  val n = (SR.toDouble() * 0.45).toInt(); val buf = ShortArray(n); var p = 0.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble()
                      val f = 55.0 + 90.0 * exp(-t * 30.0); p += 2.0 * PI * f / SR.toDouble()
                      val click = if (t < 0.004) (1.0 - t / 0.004) * 0.6 else 0.0
                      buf[i] = toShort(sin(p) * exp(-t * 7.0) + click * (Random.nextDouble() * 2.0 - 1.0))
                  }
                  return buf
              }
              private fun makeSnare(): ShortArray {
                  val n = (SR.toDouble() * 0.30).toInt(); val buf = ShortArray(n); var p = 0.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble(); p += 2.0 * PI * 200.0 / SR.toDouble()
                      buf[i] = toShort((Random.nextDouble() * 2.0 - 1.0) * exp(-t * 18.0) * 0.7 + sin(p) * exp(-t * 14.0) * 0.5)
                  }
                  return buf
              }
              private fun makeHiHat(open: Boolean = false): ShortArray {
                  val dur = if (open) 0.28 else 0.06; val n = (SR.toDouble() * dur).toInt()
                  val buf = ShortArray(n); var h1 = 0.0; var h2 = 0.0
                  val dec = if (open) 12.0 else 45.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble()
                      val noise = Random.nextDouble() * 2.0 - 1.0
                      h1 += 0.90 * (noise - h1); val band = noise - h1
                      h2 += 0.90 * (band - h2)
                      buf[i] = toShort((band - h2) * exp(-t * dec) * 0.55)
                  }
                  return buf
              }
              private fun makeClap(): ShortArray {
                  val n = (SR.toDouble() * 0.30).toInt(); val buf = ShortArray(n)
                  val starts = doubleArrayOf(0.0, 0.010, 0.021, 0.032)
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble(); var s = 0.0
                      for (st in starts) if (t >= st) { val dt = t - st; s += (Random.nextDouble() * 2.0 - 1.0) * exp(-dt * 40.0) }
                      buf[i] = toShort(s * 0.35)
                  }
                  return buf
              }
              private fun makePerc(): ShortArray {
                  val n = (SR.toDouble() * 0.18).toInt(); val buf = ShortArray(n); var p = 0.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble(); p += 2.0 * PI * 400.0 / SR.toDouble()
                      buf[i] = toShort(sin(p) * exp(-t * 25.0) * 0.8)
                  }
                  return buf
              }
              private fun makeRiser(): ShortArray {
                  val dur = 1.0; val n = (SR.toDouble() * dur).toInt(); val buf = ShortArray(n); var p = 0.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble(); val pr = t / dur
                      p += 2.0 * PI * 200.0 * 10.0.pow(pr) / SR.toDouble()
                      buf[i] = toShort(sin(p) * pr * 0.75)
                  }
                  return buf
              }
              private fun makeLaser(): ShortArray {
                  val dur = 0.20; val n = (SR.toDouble() * dur).toInt(); val buf = ShortArray(n); var p = 0.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble(); val pr = t / dur
                      p += 2.0 * PI * 2000.0 * 10.0.pow(-pr * 1.3) / SR.toDouble()
                      buf[i] = toShort(sin(p) * exp(-t * 6.0) * 0.85)
                  }
                  return buf
              }
              private fun makeSiren(): ShortArray {
                  val dur = 0.9; val n = (SR.toDouble() * dur).toInt(); val buf = ShortArray(n); var p = 0.0
                  for (i in 0 until n) {
                      val t = i.toDouble() / SR.toDouble()
                      val vib = 1.0 + 0.20 * sin(2.0 * PI * 6.0 * t)
                      p += 2.0 * PI * 800.0 * vib / SR.toDouble()
                      val env = when { t < 0.05 -> t / 0.05; t > dur - 0.1 -> (dur - t) / 0.1; else -> 1.0 }
                      buf[i] = toShort(sin(p) * env * 0.7)
                  }
                  return buf
              }
              private val cache = mutableMapOf<String, ShortArray>()
              private fun getSample(n: String): ShortArray = cache.getOrPut(n) {
                  when (n) {
                      "KICK" -> makeKick(); "SNARE" -> makeSnare()
                      "HIHAT" -> makeHiHat(); "HATOPEN" -> makeHiHat(true)
                      "CLAP" -> makeClap(); "PERC" -> makePerc()
                      "RISER" -> makeRiser(); "LASER" -> makeLaser()
                      "SIREN" -> makeSiren(); else -> makeKick()
                  }
              }
              fun play(name: String) {
                  val s = getSample(name)
                  scope.launch {
                      try {
                          val tr = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_MEDIA)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                              .setAudioFormat(AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(SR)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                              .setBufferSizeInBytes(s.size * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC).build()
                          tr.write(s, 0, s.size); tr.play()
                          kotlinx.coroutines.delay((s.size.toLong() * 1000L / SR) + 120)
                          try { tr.stop() } catch (_: Throwable) {}
                          try { tr.release() } catch (_: Throwable) {}
                      } catch (_: Throwable) {}
                  }
              }
          }
          EOF

