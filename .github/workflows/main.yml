          @Composable
          fun LibraryBrowser(
              context: Context,
              onPickTrack: (Track) -> Unit,
              modifier: Modifier = Modifier
          ) {
              var query by remember { mutableStateOf("") }
              var tracks by remember { mutableStateOf<List<Track>>(emptyList()) }
              LaunchedEffect(query) {
                  tracks = withContext(Dispatchers.IO) {
