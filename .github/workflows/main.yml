          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.ultimate.dj.Neon
          import com.ultimate.dj.audio.LibraryScanner
          import com.ultimate.dj.audio.Track
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          private val FILTERS = listOf("ALL", "AUDIO", "VIDEO", "RECENT")
          @Composable
          fun LibraryBrowser(
              context: Context,
              targetDeckName: String,
              onPickTrack: (Track) -> Unit,
              onPickForOtherDeck: (Track) -> Unit,
              onClose: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              var query by remember { mutableStateOf("") }
              var filter by remember { mutableStateOf("ALL") }
              var tracks by remember { mutableStateOf<List<Track>>(emptyList()) }
              var selected by remember { mutableStateOf<Track?>(null) }
              LaunchedEffect(query, filter) {
                  tracks = withContext(Dispatchers.IO) {
                      try { LibraryScanner.scan(context, query, filter) } catch (_: Throwable) { emptyList() }
                  }
              }
              Column(modifier = modifier.fillMaxWidth().fillMaxHeight()
                  .clip(RoundedCornerShape(8.dp))
                  .background(Neon.PANEL_GLASS)
                  .border(0.5.dp, Neon.BLUE.copy(alpha = 0.4f), RoundedCornerShape(8.dp))
                  .padding(12.dp)) {
                  Row(modifier = Modifier.fillMaxWidth().padding(bottom = 8.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      Text("LIBRARY", color = Neon.BLUE, fontSize = 12.sp,
                          fontWeight = FontWeight.Bold, letterSpacing = 4.sp)
                      Spacer(Modifier.width(12.dp))
                      Text("Load into $targetDeckName",
                          color = Neon.TEXT_DIM, fontSize = 9.sp, fontWeight = FontWeight.Medium)
                      Spacer(Modifier.weight(1f))
                      Text("${tracks.size} tracks", color = Neon.TEXT_FAINT, fontSize = 9.sp)
                      Spacer(Modifier.width(12.dp))
                      Box(modifier = Modifier.clip(RoundedCornerShape(4.dp))
                          .background(Neon.BTN_BG)
                          .border(0.5.dp, Neon.TEXT_FAINT.copy(alpha = 0.5f), RoundedCornerShape(4.dp))
                          .clickable { onClose() }
                          .padding(horizontal = 10.dp, vertical = 5.dp)) {
                          Text("CLOSE", color = Neon.TEXT_DIM, fontSize = 8.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                      }
                  }
                  OutlinedTextField(
                      value = query, onValueChange = { query = it },
                      placeholder = { Text("Search title or artist...", color = Neon.TEXT_FAINT, fontSize = 10.sp) },
                      singleLine = true,
                      modifier = Modifier.fillMaxWidth().height(46.dp)
                  )
                  Spacer(Modifier.height(6.dp))
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      for (f in FILTERS) {
                          val sel = f == filter
                          Box(modifier = Modifier.clip(RoundedCornerShape(4.dp))
                              .background(if (sel) Neon.BLUE.copy(alpha = 0.20f) else Neon.BTN_BG)
                              .border(0.5.dp, Neon.BLUE.copy(alpha = if (sel) 0.9f else 0.20f), RoundedCornerShape(4.dp))
                              .clickable { filter = f }
                              .padding(horizontal = 10.dp, vertical = 4.dp)) {
                              Text(f, color = if (sel) Neon.BLUE else Neon.TEXT_DIM,
                                  fontSize = 8.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                          }
                      }
                  }
                  Spacer(Modifier.height(6.dp))
                  if (tracks.isEmpty()) {
                      Box(modifier = Modifier.fillMaxWidth().weight(1f), contentAlignment = Alignment.Center) {
                          Text("No tracks found.\nGrant storage permission and add music/videos.",
                              color = Neon.TEXT_FAINT, fontSize = 10.sp)
                      }
                  } else {
                      LazyColumn(modifier = Modifier.fillMaxWidth().weight(1f)) {
                          items(tracks) { track ->
                              val isSel = selected?.uri == track.uri
                              Row(modifier = Modifier.fillMaxWidth()
                                  .background(if (isSel) Neon.BLUE.copy(alpha = 0.12f) else Color.Transparent)
                                  .clickable { selected = track }
                                  .padding(vertical = 8.dp, horizontal = 4.dp),
                                  verticalAlignment = Alignment.CenterVertically) {
                                  Box(modifier = Modifier.size(22.dp).clip(RoundedCornerShape(3.dp))
                                      .background(if (track.isVideo) Neon.AMBER.copy(alpha = 0.18f) else Neon.BLUE.copy(alpha = 0.18f))
                                      .border(0.5.dp, if (track.isVideo) Neon.AMBER.copy(alpha = 0.7f) else Neon.BLUE.copy(alpha = 0.7f), RoundedCornerShape(3.dp)),
                                      contentAlignment = Alignment.Center) {
                                      Text(if (track.isVideo) "V" else "♪",
                                          color = if (track.isVideo) Neon.AMBER else Neon.BLUE,
                                          fontSize = 11.sp, fontWeight = FontWeight.Bold)
                                  }
                                  Spacer(Modifier.width(8.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(track.title.take(60), color = Neon.TEXT, fontSize = 11.sp, fontWeight = FontWeight.Medium, maxLines = 1)
                                      Text(track.artist.take(30), color = Neon.TEXT_DIM, fontSize = 9.sp, maxLines = 1)
                                  }
                                  Spacer(Modifier.width(8.dp))
                                  Text("${track.durationMs / 1000 / 60}:${"%02d".format((track.durationMs / 1000) % 60)}",
                                      color = Neon.TEXT_DIM, fontSize = 9.sp)
                              }
                          }
                      }
                  }
                  if (selected != null) {
                      Spacer(Modifier.height(8.dp))
                      Row(modifier = Modifier.fillMaxWidth()
                          .clip(RoundedCornerShape(6.dp))
                          .background(Neon.PANEL_DARK)
                          .border(0.5.dp, Neon.BLUE.copy(alpha = 0.5f), RoundedCornerShape(6.dp))
                          .padding(10.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(selected!!.title, color = Neon.TEXT, fontSize = 11.sp, fontWeight = FontWeight.Bold, maxLines = 1)
                              Text(selected!!.artist, color = Neon.TEXT_DIM, fontSize = 9.sp, maxLines = 1)
                          }
                          Box(modifier = Modifier.clip(RoundedCornerShape(4.dp))
                              .background(Neon.BLUE.copy(alpha = 0.20f))
                              .border(0.5.dp, Neon.BLUE, RoundedCornerShape(4.dp))
                              .clickable { onPickTrack(selected!!) }
                              .padding(horizontal = 14.dp, vertical = 8.dp)) {
                              Text("LOAD $targetDeckName", color = Neon.BLUE, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                          }
                          Spacer(Modifier.width(6.dp))
                          Box(modifier = Modifier.clip(RoundedCornerShape(4.dp))
                              .background(Neon.BTN_BG)
                              .border(0.5.dp, Neon.TEXT_FAINT.copy(alpha = 0.5f), RoundedCornerShape(4.dp))
                              .clickable { onPickForOtherDeck(selected!!) }
                              .padding(horizontal = 12.dp, vertical = 8.dp)) {
                              Text("OTHER DECK", color = Neon.TEXT_DIM, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                          }
                      }
                  }
              }
          }
          EOF

      - name: MainActivity
        run: |
          cat > app/src/main/java/com/ultimate/dj/MainActivity.kt << 'EOF'
          package com.ultimate.dj
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.ui.Modifier
          import androidx.core.splashscreen.SplashScreen.Companion.installSplashScreen
          import com.ultimate.dj.audio.AudioEngine
          import com.ultimate.dj.video.MixRecorder
          class MainActivity : ComponentActivity() {
              private lateinit var engine: AudioEngine
              private lateinit var recorder: MixRecorder
              override fun onCreate(savedInstanceState: Bundle?) {
                  installSplashScreen()
                  super.onCreate(savedInstanceState)
                  engine = AudioEngine(this)
                  recorder = MixRecorder(this)
                  val activityRef = this
                  val engineRef = engine
                  val recorderRef = recorder
                  setContent {
                      MaterialTheme {
                          Box(modifier = Modifier.fillMaxSize().background(Neon.BG)) {
                              MainScreen(engineRef, recorderRef, activityRef)
                          }
                      }
                  }
              }
              override fun onDestroy() { super.onDestroy(); engine.release(); try { recorder.stop() } catch (_: Throwable) {} }
          }
          EOF

      - name: MainScreen
        run: |
          cat > app/src/main/java/com/ultimate/dj/MainScreen.kt << 'EOF'
          package com.ultimate.dj
          import android.app.Activity
          import android.content.Intent
          import android.widget.Toast
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectTapGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.Slider
          import androidx.compose.material3.SliderDefaults
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.graphicsLayer
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.ultimate.dj.audio.*
          import com.ultimate.dj.ui.*
          import com.ultimate.dj.video.MixRecorder
          import kotlinx.coroutines.delay
          @Composable
          fun MainScreen(engine: AudioEngine, recorder: MixRecorder, activity: Activity) {
              val context = LocalContext.current
              val isLowEnd = remember { DeviceCapabilities.isLowEnd(context) }
              var audioCrossfader by remember { mutableFloatStateOf(0.5f) }
              var videoCrossfader by remember { mutableFloatStateOf(0.5f) }
              var anyPlaying by remember { mutableStateOf(false) }
              var bpmMaster by remember { mutableFloatStateOf(128f) }
              var activeDeckA by remember { mutableStateOf(0) }
              var activeDeckB by remember { mutableStateOf(1) }
              var recording by remember { mutableStateOf(false) }
              var recordingTime by remember { mutableLongStateOf(0L) }
              var theaterMode by remember { mutableStateOf(false) }
              var libraryOpen by remember { mutableStateOf(false) }
              var libraryTarget by remember { mutableStateOf(0) }
              var countdown by remember { mutableStateOf(0) }
              val recordLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                      val started = recorder.start(result.resultCode, result.data!!)
                      if (started) {
                          recording = true
                          recordingTime = 0
                          countdown = 3
                      }
                  }
              }
              LaunchedEffect(countdown) {
                  if (countdown > 0) {
                      delay(1000)
                      countdown -= 1
                      if (countdown == 0) theaterMode = true
                  }
              }
              LaunchedEffect(Unit) {
                  while (true) {
                      anyPlaying = engine.decks.any { it.isPlaying }
                      bpmMaster = engine.deckA().bpm
                      if (recording) recordingTime += 1000
                      delay(1000)
                  }
              }
              fun toggleRecording() {
                  if (recording) {
                      val uri = recorder.stop()
                      recording = false; recordingTime = 0; theaterMode = false
                      if (uri != null) Toast.makeText(context, "Saved to Movies/ULTIMATE/${recorder.lastSavedName}", Toast.LENGTH_LONG).show()
                      else Toast.makeText(context, "Recording failed", Toast.LENGTH_SHORT).show()
                  } else {
                      recorder.buildIntent()?.let { recordLauncher.launch(it) }
                  }
              }
              fun openLibrary(targetDeck: Int) {
                  libraryTarget = targetDeck
                  libraryOpen = true
              }
              val deckA = engine.decks[activeDeckA]
              val deckB = engine.decks[activeDeckB]
              val accentA = Neon.BLUE
              val accentB = Neon.AMBER

              Box(modifier = Modifier.fillMaxSize().background(Neon.BG)) {
                  if (theaterMode) {
                      Box(modifier = Modifier.fillMaxSize().background(Color.Black)
                          .pointerInput(Unit) { detectTapGestures(onTap = { theaterMode = false }) }) {
                          VideoFullscreen(deckA, deckB, videoCrossfader)
                      }
                  } else {
                      Column(modifier = Modifier.fillMaxSize().padding(horizontal = 8.dp, vertical = 6.dp)) {

                          Row(modifier = Modifier.fillMaxWidth().height(40.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              Column {
                                  Text("ULTIMATE", color = Color.White, fontSize = 20.sp, fontWeight = FontWeight.Black, letterSpacing = 6.sp)
                                  Text("DJ STUDIO", color = Neon.BLUE, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 4.sp)
                              }
                              Spacer(Modifier.weight(1f))
                              if (isLowEnd) {
                                  TopBtn("LITE", Neon.AMBER, false) {}
                                  Spacer(Modifier.width(6.dp))
                              }
                              TopBtn("LAST REC", Neon.BLUE, false) {}
                              Spacer(Modifier.width(6.dp))
                              TopBtn("SHARE", Neon.GREEN, false) {}
                              Spacer(Modifier.width(6.dp))
                              Box(modifier = Modifier.clip(RoundedCornerShape(20.dp))
                                  .background(if (recording) Neon.RED.copy(alpha = 0.30f) else Neon.RED.copy(alpha = 0.12f))
                                  .border(1.dp, Neon.RED.copy(alpha = if (recording) 1f else 0.6f), RoundedCornerShape(20.dp))
                                  .clickable { toggleRecording() }
                                  .padding(horizontal = 14.dp, vertical = 7.dp)) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Box(modifier = Modifier.size(8.dp).clip(CircleShape).background(Neon.RED))
                                      Spacer(Modifier.width(6.dp))
                                      Text(if (recording) fmt(recordingTime) else "REC",
                                          color = Neon.RED, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                                  }
                              }
                              Spacer(Modifier.width(6.dp))
                              TopBtn("CLUB", Neon.BLUE, false) {}
                          }

                          Spacer(Modifier.height(8.dp))

                          VideoBox(deckA, deckB, videoCrossfader)

                          Spacer(Modifier.height(8.dp))

                          DeckStrip(decks = engine.decks, activeA = activeDeckA, activeB = activeDeckB,
                              onSelectA = { idx -> activeDeckA = idx },
                              onSelectB = { idx -> activeDeckB = idx })

                          Spacer(Modifier.height(8.dp))

                          Row(modifier = Modifier.fillMaxWidth().weight(1f), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              DeckPanel(
                                  deck = deckA, accent = accentA, label = "DECK A",
                                  engine = engine, deckIndex = activeDeckA,
                                  onOpenLibrary = { openLibrary(activeDeckA) },
                                  onPlay = { engine.togglePlay(activeDeckA) },
                                  onSync = { engine.syncBpm(activeDeckB, activeDeckA) },
                                  onEqChange = { l, m, h -> engine.setEq(activeDeckA, l, m, h) },
                                  modifier = Modifier.weight(1f).fillMaxHeight()
                              )
                              DeckPanel(
                                  deck = deckB, accent = accentB, label = "DECK B",
                                  engine = engine, deckIndex = activeDeckB,
                                  onOpenLibrary = { openLibrary(activeDeckB) },
                                  onPlay = { engine.togglePlay(activeDeckB) },
                                  onSync = { engine.syncBpm(activeDeckA, activeDeckB) },
                                  onEqChange = { l, m, h -> engine.setEq(activeDeckB, l, m, h) },
                                  modifier = Modifier.weight(1f).fillMaxHeight()
                              )
                          }

                          Spacer(Modifier.height(8.dp))

                          Row(modifier = Modifier.fillMaxWidth().height(38.dp),
                              verticalAlignment = Alignment.CenterVertically) {
                              Box(modifier = Modifier.size(38.dp).clip(RoundedCornerShape(6.dp))
                                  .background(Neon.BTN_BG)
                                  .border(0.5.dp, Neon.GREEN.copy(alpha = 0.6f), RoundedCornerShape(6.dp))
                                  .clickable { openLibrary(activeDeckA) },
                                  contentAlignment = Alignment.Center) {
                                  Text("LIB", color = Neon.GREEN, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                              }
                              Spacer(Modifier.width(8.dp))
                              Text("A", color = accentA, fontSize = 12.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.width(6.dp))
                              Slider(value = audioCrossfader,
                                  onValueChange = { v: Float -> audioCrossfader = v; engine.setCrossfader(v) },
                                  colors = SliderDefaults.colors(thumbColor = Color.White,
                                      activeTrackColor = accentA.copy(alpha = 0.8f),
                                      inactiveTrackColor = accentB.copy(alpha = 0.8f)),
                                  modifier = Modifier.weight(1f).height(24.dp))
                              Spacer(Modifier.width(6.dp))
                              Text("B", color = accentB, fontSize = 12.sp, fontWeight = FontWeight.Black)
                              Spacer(Modifier.width(8.dp))
                              Box(modifier = Modifier.size(38.dp).clip(RoundedCornerShape(6.dp))
                                  .background(Neon.BTN_BG)
                                  .border(0.5.dp, Neon.TEXT_FAINT.copy(alpha = 0.5f), RoundedCornerShape(6.dp)),
                                  contentAlignment = Alignment.Center) {
                                  Text("MIX", color = Neon.TEXT_DIM, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                              }
                          }
                      }

                      AnimatedVisibility(visible = libraryOpen, enter = fadeIn(), exit = fadeOut()) {
                          Box(modifier = Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.85f))) {
                              LibraryBrowser(
                                  context = context,
                                  targetDeckName = if (libraryTarget == activeDeckA) "DECK A" else "DECK B",
                                  onPickTrack = { track ->
                                      engine.loadDeck(libraryTarget, track.uri, track.title)
                                      libraryOpen = false
                                  },
                                  onPickForOtherDeck = { track ->
                                      val other = if (libraryTarget == activeDeckA) activeDeckB else activeDeckA
                                      engine.loadDeck(other, track.uri, track.title)
                                      libraryOpen = false
                                  },
                                  onClose = { libraryOpen = false },
                                  modifier = Modifier.fillMaxSize().padding(24.dp)
                              )
                          }
                      }

                      if (countdown > 0) {
                          Box(modifier = Modifier.fillMaxSize().background(Color.Black.copy(alpha = 0.85f)),
                              contentAlignment = Alignment.Center) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Text("Recording starts in", color = Neon.TEXT_DIM, fontSize = 12.sp, letterSpacing = 3.sp)
                                  Spacer(Modifier.height(12.dp))
                                  Text("$countdown", color = Neon.RED, fontSize = 72.sp, fontWeight = FontWeight.Black)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun TopBtn(label: String, accent: Color, active: Boolean, onClick: () -> Unit) {
              Box(modifier = Modifier.clip(RoundedCornerShape(20.dp))
                  .background(if (active) accent.copy(alpha = 0.25f) else accent.copy(alpha = 0.10f))
                  .border(1.dp, accent.copy(alpha = if (active) 1f else 0.6f), RoundedCornerShape(20.dp))
                  .clickable { onClick() }
                  .padding(horizontal = 14.dp, vertical = 7.dp)) {
                  Text(label, color = accent, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
              }
          }

          @Composable
          private fun VideoBox(deckA: DeckPlayer, deckB: DeckPlayer, videoCrossfader: Float) {
              Box(modifier = Modifier.fillMaxWidth().height(200.dp)
                  .clip(RoundedCornerShape(8.dp))
                  .background(Color.Black)
                  .border(1.dp, Neon.BORDER_SOFT, RoundedCornerShape(8.dp))) {
                  VideoContents(deckA, deckB, videoCrossfader)
              }
          }

          @Composable
          private fun VideoFullscreen(deckA: DeckPlayer, deckB: DeckPlayer, videoCrossfader: Float) {
              Box(modifier = Modifier.fillMaxSize().background(Color.Black)) {
                  VideoContents(deckA, deckB, videoCrossfader)
              }
          }

          @Composable
          private fun VideoContents(deckA: DeckPlayer, deckB: DeckPlayer, videoCrossfader: Float) {
              if (deckA.hasVideo) {
                  VideoDeckView(deckA, videoCrossfader, false, VideoTransition.CROSSFADE, Neon.BLUE, false, Modifier.fillMaxSize())
              } else if (deckA.isLoaded) {
                  AudioVisualizer(Neon.BLUE, deckA.isPlaying, deckA.loadedName, deckA.waveform, Modifier.fillMaxSize())
              }
              if (deckB.hasVideo) {
                  VideoDeckView(deckB, videoCrossfader, true, VideoTransition.CROSSFADE, Neon.AMBER, false, Modifier.fillMaxSize())
              } else if (deckB.isLoaded) {
                  Box(modifier = Modifier.fillMaxSize().graphicsLayer { alpha = (1f - videoCrossfader).coerceIn(0f, 1f) }) {
                      AudioVisualizer(Neon.AMBER, deckB.isPlaying, deckB.loadedName, deckB.waveform, Modifier.fillMaxSize())
                  }
              }
              if (!deckA.isLoaded && !deckB.isLoaded) {
                  Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                      Column(horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("LOAD A VIDEO OR AUDIO", color = Neon.BLUE, fontSize = 16.sp,
                              fontWeight = FontWeight.Black, letterSpacing = 4.sp)
                          Spacer(Modifier.height(6.dp))
                          Text("Drag & drop or select from media library to start mixing",
                              color = Neon.TEXT_FAINT, fontSize = 10.sp, letterSpacing = 1.sp)
                      }
                  }
              }
              Box(modifier = Modifier.align(Alignment.TopStart).padding(8.dp)
                  .clip(RoundedCornerShape(20.dp)).background(Neon.BLUE.copy(alpha = 0.15f))
                  .border(1.dp, Neon.BLUE.copy(alpha = 0.7f), RoundedCornerShape(20.dp))
                  .padding(horizontal = 12.dp, vertical = 4.dp)) {
                  Text("MIX", color = Neon.BLUE, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 3.sp)
              }
              Row(modifier = Modifier.align(Alignment.TopEnd).padding(8.dp), horizontalArrangement = Arrangement.spacedBy(5.dp)) {
                  Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(if (deckA.isPlaying) Neon.BLUE else Color(0x33FFFFFF)))
                  Box(modifier = Modifier.size(9.dp).clip(CircleShape).background(if (deckB.isPlaying) Neon.AMBER else Color(0x33FFFFFF)))
              }
          }

          @Composable
          private fun DeckPanel(
              deck: DeckPlayer, accent: Color, label: String,
              engine: AudioEngine, deckIndex: Int,
              onOpenLibrary: () -> Unit, onPlay: () -> Unit, onSync: () -> Unit,
              onEqChange: (Float, Float, Float) -> Unit,
              modifier: Modifier = Modifier
          ) {
              var positionMs by remember { mutableLongStateOf(0L) }
              var durationMs by remember { mutableLongStateOf(0L) }
              var hiVal by remember { mutableFloatStateOf(0f) }
              var midVal by remember { mutableFloatStateOf(0f) }
              var lowVal by remember { mutableFloatStateOf(0f) }
              val isPlaying = deck.isPlaying
              LaunchedEffect(deck) { while (true) { positionMs = deck.positionMs(); durationMs = deck.durationMs(); delay(400) } }

              Column(modifier = modifier
                  .clip(RoundedCornerShape(8.dp))
                  .background(Neon.PANEL)
                  .border(0.5.dp, if (isPlaying) accent.copy(alpha = 0.6f) else Neon.BORDER_SOFT, RoundedCornerShape(8.dp))
                  .padding(8.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {

                  Row(modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically) {
                      Text(label, color = accent, fontSize = 11.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      Box(modifier = Modifier.clip(RoundedCornerShape(4.dp))
                          .background(accent.copy(alpha = 0.15f))
                          .border(1.dp, accent.copy(alpha = 0.7f), RoundedCornerShape(4.dp))
                          .clickable { onOpenLibrary() }
                          .padding(horizontal = 12.dp, vertical = 4.dp)) {
                          Text("LOAD", color = accent, fontSize = 9.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                      }
                  }

                  Row(modifier = Modifier.fillMaxWidth().weight(1f),
                      verticalAlignment = Alignment.CenterVertically) {
                      Box(modifier = Modifier.weight(1f).fillMaxHeight(), contentAlignment = Alignment.Center) {
                          MetalJogWheel(accent = accent, size = 110.dp, isPlaying = isPlaying,
                              onScratchStart = { engine.beginScratch(deckIndex) },
                              onScratchMove = { dy: Float -> engine.scratchMove(deckIndex, dy) },
                              onScratchEnd = { engine.endScratch(deckIndex) })
                      }
                      Column(modifier = Modifier.width(52.dp).fillMaxHeight(),
                          horizontalAlignment = Alignment.CenterHorizontally) {
                          Text("VOL", color = Neon.TEXT_FAINT, fontSize = 7.sp, fontWeight = FontWeight.Bold, letterSpacing = 1.sp)
                          Spacer(Modifier.height(4.dp))
                          Box(modifier = Modifier.weight(1f), contentAlignment = Alignment.Center) {
                              VolumeFader(
                                  accent = accent,
                                  initialValue = 0.75f,
                                  onValueChange = { v: Float -> deck.setVolume(v) }
                              )
                          }
                      }
                  }

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically) {
                      KnobSmall("LOW", accent, lowVal, size = 42.dp,
                          onValueChange = { v: Float -> lowVal = v; onEqChange(v, midVal, hiVal) })
                      KnobSmall("MID", accent, midVal, size = 42.dp,
                          onValueChange = { v: Float -> midVal = v; onEqChange(lowVal, v, hiVal) })
                      KnobSmall("HIGH", accent, hiVal, size = 42.dp,
                          onValueChange = { v: Float -> hiVal = v; onEqChange(lowVal, midVal, v) })
                  }

                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      Box(modifier = Modifier.weight(1f).clip(RoundedCornerShape(6.dp))
                          .background(accent.copy(alpha = 0.12f))
                          .border(1.dp, accent.copy(alpha = 0.7f), RoundedCornerShape(6.dp))
                          .clickable { onSync() }
                          .padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                          Text("SYNC", color = accent, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      }
                      Box(modifier = Modifier.weight(1f).clip(RoundedCornerShape(6.dp))
                          .background(accent.copy(alpha = 0.12f))
                          .border(1.dp, accent.copy(alpha = 0.7f), RoundedCornerShape(6.dp))
                          .clickable { engine.setCue(deckIndex, 0) }
                          .padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                          Text("CUE", color = accent, fontSize = 10.sp, fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      }
                  }

                  Box(modifier = Modifier.fillMaxWidth().clip(RoundedCornerShape(6.dp))
                      .background(if (isPlaying) accent.copy(alpha = 0.25f) else Neon.BTN_BG)
                      .border(1.dp, accent.copy(alpha = if (isPlaying) 1f else 0.5f), RoundedCornerShape(6.dp))
                      .clickable { onPlay() }
                      .padding(vertical = 10.dp), contentAlignment = Alignment.Center) {
                      Text(if (isPlaying) "PAUSE" else "PLAY",
                          color = accent, fontSize = 11.sp, fontWeight = FontWeight.Black, letterSpacing = 3.sp)
                  }

                  Text(if (deck.loadedName.isNotEmpty()) deck.loadedName else "No track loaded",
                      color = if (deck.isLoaded) Neon.TEXT else Neon.TEXT_FAINT,
                      fontSize = 10.sp, fontWeight = FontWeight.Medium, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                      Text("${fmt(positionMs)} / ${fmt(durationMs)}",
                          color = Neon.TEXT_DIM, fontSize = 9.sp, fontWeight = FontWeight.Medium)
                      Text("${"%.0f".format(deck.bpm)} BPM",
                          color = accent, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                  }
              }
          }

          private fun fmt(ms: Long): String {
              if (ms <= 0) return "00:00"
              val s = ms / 1000
              return "%02d:%02d".format(s / 60, s % 60)
          }
          EOF

      - name: gitignore
        run: |
          cat > .gitignore << 'EOF'
          *.iml
          .gradle
          /local.properties
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          *.apk
          *.aab
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ULTIMATE-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Commit and push
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ULTIMATE v7.1: fixed VolumeFader/KnobSmall lambda types, VideoStrip removed weight"
          git push || echo "push failed"
