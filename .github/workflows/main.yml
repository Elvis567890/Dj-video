                  }
              }
              fun censor(beats: Int = 4) {
                  censorJob?.cancel()
                  censorJob = scope.launch {
                      try {
                          censorActive = true
                          val wasPlaying = player.isPlaying
                          val beatMs = (60000f / bpm).toLong()
                          val totalMs = beatMs * beats
                          val startMs = player.currentPosition
