      - name: MainActivity.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/MainActivity.kt << 'EOF'
          package com.djpro.mixer

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.ui.graphics.Color
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.ui.Modifier
          import androidx.compose.foundation.layout.Box

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme {
                          Box(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .background(Color(0xFF05050A))
                          ) {
                              SixDeckScreen()
                          }
                      }
                  }
              }
          }
          EOF

      - name: NeonTheme.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/NeonTheme.kt << 'EOF'
          package com.djpro.mixer

          import androidx.compose.ui.graphics.Color

          object Neon {
              val BG = Color(0xFF05050A)
              val PANEL = Color(0xFF0E0E16)
              val PANEL_BORDER = Color(0xFF1E1E2E)
              val CYAN = Color(0xFF00E5FF)
              val MAGENTA = Color(0xFFFF2BD6)
              val LIME = Color(0xFF9CFF2B)
              val ORANGE = Color(0xFFFF8A00)
              val PURPLE = Color(0xFF9C27FF)
              val RED = Color(0xFFFF3B5C)
              val TEXT = Color(0xFFE5E5F0)
              val TEXT_DIM = Color(0x80E5E5F0)
          }
          EOF

      - name: SixDeckScreen.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/SixDeckScreen.kt << 'EOF'
          package com.djpro.mixer

          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          private val deckColors = listOf(
              Neon.CYAN, Neon.MAGENTA, Neon.LIME, Neon.ORANGE, Neon.PURPLE, Neon.RED
          )

          @Composable
          fun SixDeckScreen() {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Neon.BG)
                      .padding(8.dp)
              ) {
                  // Header
                  Row(
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 8.dp, vertical = 4.dp),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text("DJ PRO MIXER", color = Neon.CYAN, fontSize = 20.sp,
                          fontWeight = FontWeight.Bold, letterSpacing = 4.sp)
                      Text("6-DECK / STEMS / VIDEO", color = Neon.TEXT_DIM, fontSize = 10.sp,
                          letterSpacing = 2.sp)
                  }

                  Spacer(Modifier.height(8.dp))

                  // Main area: 2 big video decks on top, crossfader below
                  Row(
                      modifier = Modifier.fillMaxWidth().weight(1f),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      BigDeckPanel("DECK 1", deckColors[0], Modifier.weight(1f))
                      CenterMixPanel(Modifier.weight(1.2f))
                      BigDeckPanel("DECK 2", deckColors[1], Modifier.weight(1f))
                  }

                  Spacer(Modifier.height(8.dp))

                  // 4 mini sample decks
                  Row(
                      modifier = Modifier.fillMaxWidth().height(140.dp),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      for (i in 2 until 6) {
                          MiniDeckPanel("DECK ${i+1}", deckColors[i], Modifier.weight(1f))
                      }
                  }
              }
          }

          @Composable
          fun BigDeckPanel(title: String, accent: Color, modifier: Modifier) {
              Column(
                  modifier = modifier
                      .clip(RoundedCornerShape(14.dp))
                      .background(Neon.PANEL)
                      .border(1.dp, accent.copy(alpha = 0.4f), RoundedCornerShape(14.dp))
                      .padding(10.dp),
                  verticalArrangement = Arrangement.SpaceBetween,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Text(title, color = accent, fontSize = 14.sp, fontWeight = FontWeight.Bold,
                      letterSpacing = 2.sp)

                  Box(
                      modifier = Modifier
                          .size(180.dp)
                          .clip(RoundedCornerShape(90.dp))
                          .background(Color(0xFF16161E))
                          .border(3.dp, accent, RoundedCornerShape(90.dp))
                  )

                  // Stem mute row
                  Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                      StemButton("VOX", accent)
                      StemButton("DRM", accent)
                      StemButton("BAS", accent)
                      StemButton("OTH", accent)
                  }

                  // Transport
                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      TransportBtn("LOAD", accent)
                      TransportBtn("▶", accent)
                      TransportBtn("CUE", accent)
                  }
              }
          }

          @Composable
          fun StemButton(label: String, accent: Color) {
              Box(
                  modifier = Modifier
                      .size(38.dp)
                      .clip(RoundedCornerShape(8.dp))
                      .background(Color(0xFF1A1A24))
                      .border(1.dp, accent.copy(alpha = 0.3f), RoundedCornerShape(8.dp)),
                  contentAlignment = Alignment.Center
              ) {
                  Text(label, color = accent.copy(alpha = 0.7f), fontSize = 9.sp,
                      fontWeight = FontWeight.Bold)
              }
          }

          @Composable
          fun TransportBtn(label: String, accent: Color) {
              Box(
                  modifier = Modifier
                      .clip(RoundedCornerShape(8.dp))
                      .background(Color(0xFF1A1A24))
                      .border(1.dp, accent.copy(alpha = 0.4f), RoundedCornerShape(8.dp))
                      .padding(horizontal = 10.dp, vertical = 6.dp)
              ) {
                  Text(label, color = accent, fontSize = 10.sp, fontWeight = FontWeight.Bold)
              }
          }

          @Composable
          fun CenterMixPanel(modifier: Modifier) {
              Column(
                  modifier = modifier
                      .clip(RoundedCornerShape(14.dp))
                      .background(Neon.PANEL)
                      .border(1.dp, Color(0xFF2A2A3A), RoundedCornerShape(14.dp))
                      .padding(10.dp),
                  verticalArrangement = Arrangement.spacedBy(8.dp)
              ) {
                  // Video mix window
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                          .clip(RoundedCornerShape(10.dp))
                          .background(Color.Black)
                          .border(1.dp, Neon.CYAN.copy(alpha = 0.3f), RoundedCornerShape(10.dp)),
                      contentAlignment = Alignment.Center
                  ) {
                      Text("VIDEO MIX", color = Neon.CYAN.copy(alpha = 0.4f),
                          fontSize = 12.sp, letterSpacing = 3.sp)
                  }

                  // Crossfader
                  Text("CROSSFADER", color = Neon.TEXT_DIM, fontSize = 9.sp,
                      letterSpacing = 2.sp, modifier = Modifier.align(Alignment.CenterHorizontally))
                  Slider(
                      value = 0.5f,
                      onValueChange = {},
                      colors = SliderDefaults.colors(
                          thumbColor = Neon.CYAN,
                          activeTrackColor = Neon.CYAN,
                          inactiveTrackColor = Neon.MAGENTA.copy(alpha = 0.5f)
                      ),
                      modifier = Modifier.fillMaxWidth()
                  )

                  // FX row
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      FxChip("ECHO", Neon.CYAN, Modifier.weight(1f))
                      FxChip("FILTER", Neon.LIME, Modifier.weight(1f))
                      FxChip("FLANGE", Neon.PURPLE, Modifier.weight(1f))
                  }
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      FxChip("REVERB", Neon.ORANGE, Modifier.weight(1f))
                      FxChip("REC", Neon.RED, Modifier.weight(1f))
                      FxChip("MASTER", Neon.MAGENTA, Modifier.weight(1f))
                  }
              }
          }

          @Composable
          fun FxChip(label: String, accent: Color, modifier: Modifier) {
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(10.dp))
                      .background(accent.copy(alpha = 0.12f))
                      .border(1.dp, accent.copy(alpha = 0.5f), RoundedCornerShape(10.dp))
                      .padding(vertical = 10.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Text(label, color = accent, fontSize = 11.sp, fontWeight = FontWeight.Bold,
                      letterSpacing = 1.sp)
              }
          }

          @Composable
          fun MiniDeckPanel(title: String, accent: Color, modifier: Modifier) {
              Column(
                  modifier = modifier
                      .clip(RoundedCornerShape(12.dp))
                      .background(Neon.PANEL)
                      .border(1.dp, accent.copy(alpha = 0.3f), RoundedCornerShape(12.dp))
                      .padding(8.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.SpaceBetween
              ) {
                  Text(title, color = accent, fontSize = 10.sp, fontWeight = FontWeight.Bold,
                      letterSpacing = 1.sp)
                  Box(
                      modifier = Modifier
                          .size(58.dp)
                          .clip(RoundedCornerShape(29.dp))
                          .background(Color(0xFF16161E))
                          .border(2.dp, accent.copy(alpha = 0.6f), RoundedCornerShape(29.dp))
                  )
                  Row(horizontalArrangement = Arrangement.spacedBy(3.dp)) {
                      TransportBtn("L", accent)
                      TransportBtn("▶", accent)
                  }
              }
          }
          EOF

      - name: .gitignore and commit
        run: |
          cat > .gitignore << 'EOF'
          *.iml
          .gradle
          /local.properties
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          *.apk
          *.aab
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pro DJ app: 6 decks, Oboe engine, stems, video recording" || echo "nothing"
          git push

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJProMixer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
