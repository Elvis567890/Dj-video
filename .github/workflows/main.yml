          @Composable
          private fun FxChip(label: String, accent: Color, modifier: Modifier = Modifier) {
              Box(
                  modifier = modifier
                      .clip(RoundedCornerShape(10.dp))
                      .background(accent.copy(alpha = 0.12f))
                      .border(1.dp, accent.copy(alpha = 0.5f), RoundedCornerShape(10.dp))
                      .padding(vertical = 10.dp),
                  contentAlignment = Alignment.Center,
              ) {
                  Text(label, color = accent, fontSize = 11.sp, fontWeight = FontWeight.Bold)
              }
          }
          EOF

      - name: .gitignore
        run: |
          cat > .gitignore << 'EOF'
          *.iml
          .gradle
          /local.properties
          /.idea
          .DS_Store
          /build
          /captures
          .externalNativeBuild
          .cxx
          *.apk
          *.aab
          EOF

      # ==================================================
      # 6. GENERATE GRADLE WRAPPER (AFTER all files written)
      # ==================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # ==================================================
      # 7. COMMIT
      # ==================================================
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Full DJ app with nativecore fix + clean build" || echo "nothing"
          git push

      # ==================================================
      # 8. BUILD
      # ==================================================
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJProMixer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
