name: Build DJ Pro Mixer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean stale files
        run: |
          rm -rf app core-audio core-dsp core-stems core-video core-db native
          rm -f settings.gradle.kts build.gradle.kts gradle.properties
          rm -rf gradle .gradle .cxx
          find . -name "*.gradle.kts" -not -path "./.git/*" -delete 2>/dev/null || true

      - name: Create directories
        run: |
          mkdir -p gradle/wrapper
          mkdir -p app/src/main/java/com/djpro/mixer/audio
          mkdir -p app/src/main/java/com/djpro/mixer/dsp
          mkdir -p app/src/main/java/com/djpro/mixer/video
          mkdir -p app/src/main/java/com/djpro/mixer/ui
          mkdir -p app/src/main/res/values

      - name: Root gradle files
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DJProMixer"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=false
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: app/build.gradle.kts
        run: |
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.djpro.mixer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.djpro.mixer"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 11
                  versionName = "5.0.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
                  freeCompilerArgs += listOf("-Xjvm-default=all")
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                      excludes += "/META-INF/DEPENDENCIES"
                      excludes += "/META-INF/LICENSE*"
                      excludes += "/META-INF/NOTICE*"
                  }
              }
              lint { abortOnError = false; checkReleaseBuilds = false }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
              implementation("androidx.media3:media3-common:1.4.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

      - name: Manifest + resources
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <application
                  android:allowBackup="true"
                  android:label="DJ Pro Mixer"
                  android:largeHeap="true"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@style/Theme.DJPro"
                  tools:ignore="GoogleAppIndexingWarning,UnusedAttribute">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      tools:ignore="LockedOrientationActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".video.RecordingService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection|microphone"
                      tools:ignore="ForegroundServicePermission" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/themes.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.DJPro" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#05050A</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">DJ Pro Mixer</string></resources>
          EOF

      - name: DSP files
        run: |
          cat > app/src/main/java/com/djpro/mixer/dsp/EchoAudioProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class EchoAudioProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var mix: Float = 0.35f
              private var delayBuffer = ShortArray(0)
              private var writePos = 0
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  val samples = (inputFormat.sampleRate * 0.28f).toInt().coerceAtLeast(1)
                  delayBuffer = ShortArray(samples * inputFormat.channelCount); writePos = 0
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled || delayBuffer.isEmpty()) out.put(inputBuffer)
                  else while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short; val d = delayBuffer[writePos]
                      val mixed = (s + (d * mix).toInt()).coerceIn(-32768, 32767).toShort()
                      delayBuffer[writePos] = s; out.putShort(mixed)
                      writePos = (writePos + 1) % delayBuffer.size
                  }
                  out.flip()
              }
              override fun onFlush() { delayBuffer.fill(0); writePos = 0 }
              override fun onReset() { delayBuffer = ShortArray(0) }
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/FilterAudioProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class FilterAudioProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var depth: Float = 0.15f
              private var prev = FloatArray(2)
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  prev = FloatArray(inputFormat.channelCount); return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val ch = prev.size; var i = 0
                  val a = depth.coerceIn(0.01f, 1f)
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f
                      val c = i % ch
                      val filtered = if (enabled) { val y = a * s + (1 - a) * prev[c]; prev[c] = y; y } else s
                      out.putShort((filtered * 32767f).coerceIn(-32768f, 32767f).toInt().toShort()); i++
                  }
                  out.flip()
              }
              override fun onFlush() { prev.fill(0f) }
              override fun onReset() { prev = FloatArray(2) }
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/VocalRemovalProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class VocalRemovalProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled) out.put(inputBuffer)
                  else {
                      while (inputBuffer.remaining() >= 4) {
                          val l = inputBuffer.short.toInt(); val r = inputBuffer.short.toInt()
                          val side = (l - r) / 2
                          out.putShort((side * 2).coerceIn(-32768, 32767).toShort())
                          out.putShort((-side * 2).coerceIn(-32768, 32767).toShort())
                      }
                      while (inputBuffer.remaining() > 0) out.put(inputBuffer.get())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/EqProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import kotlin.math.pow
          class EqProcessor : BaseAudioProcessor() {
              @Volatile var lowGainDb = 0f
              @Volatile var midGainDb = 0f
              @Volatile var highGainDb = 0f
              private var channels = 2
              private var lowPrev = FloatArray(2)
              private var hpPrevIn = FloatArray(2)
              private var hpPrevOut = FloatArray(2)
              private var lpCoeff = 0f
              private var hpCoeff = 0f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  channels = inputFormat.channelCount
                  lowPrev = FloatArray(channels); hpPrevIn = FloatArray(channels); hpPrevOut = FloatArray(channels)
                  val dt = 1f / inputFormat.sampleRate
                  val rcLp = 1f / (2f * Math.PI.toFloat() * 200f); lpCoeff = dt / (rcLp + dt)
                  val rcHp = 1f / (2f * Math.PI.toFloat() * 4000f); hpCoeff = rcHp / (rcHp + dt)
                  return inputFormat
              }
              private fun dbToLin(db: Float) = if (db == 0f) 1f else 10f.pow(db / 20f)
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val ch = channels; var i = 0
                  val lg = dbToLin(lowGainDb); val mg = dbToLin(midGainDb); val hg = dbToLin(highGainDb)
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f; val c = i % ch
                      lowPrev[c] += lpCoeff * (s - lowPrev[c]); val low = lowPrev[c]
                      hpPrevOut[c] = hpCoeff * (hpPrevOut[c] + s - hpPrevIn[c]); hpPrevIn[c] = s; val high = hpPrevOut[c]
                      val mid = s - low - high
                      val y = (low * lg + mid * mg + high * hg).coerceIn(-1f, 1f)
                      out.putShort((y * 32767f).toInt().toShort()); i++
                  }
                  out.flip()
              }
              override fun onFlush() { lowPrev.fill(0f); hpPrevIn.fill(0f); hpPrevOut.fill(0f) }
              override fun onReset() { lowPrev = FloatArray(2); hpPrevIn = FloatArray(2); hpPrevOut = FloatArray(2) }
          }
          EOF

          cat > app/src/main/java/com/djpro/mixer/dsp/MasterLimiterProcessor.kt << 'EOF'
          package com.djpro.mixer.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import kotlin.math.tanh
          class MasterLimiterProcessor : BaseAudioProcessor() {
              @Volatile var ceiling: Float = 0.92f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f
                      val limited = tanh(s).toFloat() * ceiling
                      out.putShort((limited * 32767f).toInt().toShort())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

      - name: DeckPlayer.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/DeckPlayer.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.content.Context
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.media3.common.MediaItem
          import androidx.media3.common.Player
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.audio.AudioSink
          import androidx.media3.exoplayer.audio.DefaultAudioSink
          import com.djpro.mixer.dsp.EchoAudioProcessor
          import com.djpro.mixer.dsp.EqProcessor
          import com.djpro.mixer.dsp.FilterAudioProcessor
          import com.djpro.mixer.dsp.MasterLimiterProcessor
          import com.djpro.mixer.dsp.VocalRemovalProcessor
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          class DeckPlayer(val index: Int, context: Context) {
              val echo = EchoAudioProcessor()
              val filter = FilterAudioProcessor()
              val vocal = VocalRemovalProcessor()
              val eq = EqProcessor()
              val limiter = MasterLimiterProcessor()
              private val audioSink: AudioSink = DefaultAudioSink.Builder()
                  .setAudioProcessors(arrayOf<AudioProcessor>(eq, echo, filter, vocal, limiter)).build()
              private val renderersFactory = object : DefaultRenderersFactory(context) {
                  override fun buildAudioSink(context: Context, enableFloatOutput: Boolean,
                                              enableAudioTrackPlaybackParams: Boolean): AudioSink = audioSink
              }
              val player: ExoPlayer = ExoPlayer.Builder(context, renderersFactory).build().apply {
                  repeatMode = Player.REPEAT_MODE_OFF; playWhenReady = false; volume = 1f
              }
              var isLoaded by mutableStateOf(false); private set
              var isPlaying by mutableStateOf(false); private set
              var scratching by mutableStateOf(false); private set
              var scratchRate by mutableFloatStateOf(1f); private set
              var scratchVelocity by mutableFloatStateOf(0f); private set
              var bpm: Float = 128f; private set
              var loadedName: String = ""; private set
              val cuePoints = LongArray(8) { -1L }
              var loopActive by mutableStateOf(false); private set
              var loopBeats = 4; private set
              var loopStartMs = 0L; private set
              var loopEndMs = 0L; private set
              private var scratchStartMs = 0L
              private var scratchAccumMs = 0L
              private var wasPlayingBeforeScratch = false
              private val scope = CoroutineScope(Dispatchers.Main + Job())
              private var effectJob: Job? = null
              private var loopJob: Job? = null

              fun load(uri: String, displayName: String = "Loaded") {
                  try {
                      player.setMediaItem(MediaItem.fromUri(uri)); player.prepare()
                      isLoaded = true; bpm = 120f + (0..16).random(); loadedName = displayName
                  } catch (_: Throwable) { isLoaded = false }
              }
              fun play() { try { player.play(); isPlaying = true } catch (_: Throwable) {} }
              fun pause() { try { player.pause(); isPlaying = false } catch (_: Throwable) {} }
              fun toggle() { if (isPlaying) pause() else play() }
              fun setVolume(v: Float) { try { player.volume = v.coerceIn(0f, 1f) } catch (_: Throwable) {} }
              fun currentSpeed(): Float = try { player.playbackParameters.speed } catch (_: Throwable) { 1f }

              fun beginScratch() {
                  try {
                      wasPlayingBeforeScratch = player.isPlaying
                      scratching = true
                      scratchStartMs = player.currentPosition; scratchAccumMs = 0L
                      scratchRate = 0f; scratchVelocity = 0f
                      player.pause()
                  } catch (_: Throwable) {}
              }
              fun scratchMove(deltaPixels: Float) {
                  try {
                      val msPerPixel = 5f
                      scratchAccumMs += (-deltaPixels * msPerPixel).toLong()
                      val dur = player.duration.takeIf { it > 0 } ?: Long.MAX_VALUE
                      val target = (scratchStartMs + scratchAccumMs).coerceIn(0L, dur)
                      player.seekTo(target)
                      val instantRate = (-deltaPixels / 15f).coerceIn(-3f, 3f)
                      scratchRate = instantRate; scratchVelocity = instantRate
                  } catch (_: Throwable) {}
              }
              fun endScratch() {
                  try {
                      val inertiaMs = (scratchAccumMs * 0.20f).toLong()
                      val dur = player.duration.takeIf { it > 0 } ?: Long.MAX_VALUE
                      val finalPos = (scratchStartMs + scratchAccumMs + inertiaMs).coerceIn(0L, dur)
                      player.seekTo(finalPos)
                      if (wasPlayingBeforeScratch) player.play()
                      scratching = false; scratchRate = 1f; scratchVelocity = 0f
                  } catch (_: Throwable) { scratching = false }
              }
              fun spinback() {
                  effectJob?.cancel()
                  effectJob = scope.launch {
                      try {
                          val wasPlaying = player.isPlaying
                          scratching = true
                          val startMs = player.currentPosition
                          val rewindMs = 900L; val steps = 18; val stepBack = rewindMs / steps
                          for (i in 0 until steps) {
                              player.seekTo((startMs - i * stepBack).coerceAtLeast(0L))
                              scratchRate = -3f; scratchVelocity = -3f; delay(18)
                          }
                          scratchRate = 1f; scratchVelocity = 0f; scratching = false
                          if (wasPlaying) player.play()
                      } catch (_: Throwable) { scratching = false }
                  }
              }
              fun brake() {
                  effectJob?.cancel()
                  effectJob = scope.launch {
                      try {
                          scratching = true
                          var speed = player.playbackParameters.speed
                          if (speed <= 0.05f) speed = 1f
                          val step = (speed - 0.05f) / 14f
                          for (i in 0 until 14) {
                              speed -= step; player.setPlaybackSpeed(speed.coerceAtLeast(0.05f))
                              scratchRate = speed; scratchVelocity = speed - 1f; delay(35)
                          }
                          player.pause(); player.setPlaybackSpeed(1f)
                          scratchRate = 1f; scratchVelocity = 0f
                      } catch (_: Throwable) {}
                      scratching = false
                  }
              }
              fun setCue(slot: Int) { if (slot in 0..7) cuePoints[slot] = positionMs() }
              fun jumpToCue(slot: Int) {
                  if (slot !in 0..7) return
                  val t = cuePoints[slot]; if (t >= 0) try { player.seekTo(t) } catch (_: Throwable) {}
              }
              fun toggleLoop(beats: Int = loopBeats) { loopBeats = beats; if (loopActive) stopLoop() else startLoop(beats) }
              private fun startLoop(beats: Int) {
                  try {
                      val beatMs = if (bpm > 0) (60000f / bpm).toLong() else 500L
                      val loopLen = beatMs * beats; val start = positionMs()
                      loopStartMs = start; loopEndMs = start + loopLen; loopActive = true
                      loopJob?.cancel(); loopJob = scope.launch {
                          while (loopActive) {
                              try { if (player.currentPosition >= loopEndMs) player.seekTo(loopStartMs) } catch (_: Throwable) {}
                              delay(30)
                          }
                      }
                  } catch (_: Throwable) {}
              }
              fun stopLoop() { loopActive = false; loopJob?.cancel(); loopJob = null }
              fun positionMs(): Long = try { player.currentPosition } catch (_: Throwable) { 0L }
              fun durationMs(): Long = try { val d = player.duration; if (d > 0) d else 0L } catch (_: Throwable) { 0L }
              fun release() {
                  effectJob?.cancel(); loopJob?.cancel()
                  try { player.release() } catch (_: Throwable) {}
                  try { audioSink.release() } catch (_: Throwable) {}
              }
          }
          EOF

      - name: AudioEngine.kt
        run: |
          cat > app/src/main/java/com/djpro/mixer/audio/AudioEngine.kt << 'EOF'
          package com.djpro.mixer.audio
          import android.content.Context
          import kotlin.math.cos
          import kotlin.math.sin
          enum class CrossfaderMode { CUT, FADE }
          class AudioEngine(context: Context) {
              val decks: List<DeckPlayer> = (0 until 6).map { DeckPlayer(it, context) }
              var crossfader: Float = 0.5f; private set
              var crossfaderMode: CrossfaderMode = CrossfaderMode.FADE; private set
              var masterVolume: Float = 1.0f; private set
              var activeDeckA: Int = 0; private set
              var activeDeckB: Int = 1; private set
              var echoEnabled = false; var filterEnabled = false; var vocalRemovalEnabled = false
              var stemDrumsMuted = false; var stemBassMuted = false; var stemOtherMuted = false
              val history = mutableListOf<String>()
              init { setCrossfader(0.5f); setMasterVolume(1.0f) }
              fun swapToA(deckId: Int) { if (deckId in decks.indices && deckId != activeDeckB) { activeDeckA = deckId; applyCrossfader() } }
              fun swapToB(deckId: Int) { if (deckId in decks.indices && deckId != activeDeckB && deckId != activeDeckA) { activeDeckB = deckId; applyCrossfader() } }
              fun deckA(): DeckPlayer = decks[activeDeckA]
              fun deckB(): DeckPlayer = decks[activeDeckB]
              fun setCrossfader(v: Float) { crossfader = v.coerceIn(0f, 1f); applyCrossfader() }
              fun setCrossfaderMode(m: CrossfaderMode) { crossfaderMode = m; applyCrossfader() }
              private fun applyCrossfader() {
                  val (a, b) = when (crossfaderMode) {
                      CrossfaderMode.FADE -> cos(crossfader * Math.PI / 2).toFloat() to sin(crossfader * Math.PI / 2).toFloat()
                      CrossfaderMode.CUT -> {
                          val zone = 0.05f
                          when {
                              crossfader < 0.5f - zone -> 1f to 0f
                              crossfader > 0.5f + zone -> 0f to 1f
                              else -> { val t = (crossfader - (0.5f - zone)) / (2 * zone); 1f - t to t }
                          }
                      }
                  }
                  decks[activeDeckA].setVolume(a * masterVolume)
                  decks[activeDeckB].setVolume(b * masterVolume)
              }
              fun setMasterVolume(v: Float) { masterVolume = v.coerceIn(0f, 1f); applyCrossfader() }
              fun setEcho(on: Boolean) { echoEnabled = on; decks.forEach { it.echo.enabled = on } }
              fun setFilter(on: Boolean) { filterEnabled = on; decks.forEach { it.filter.enabled = on } }
              fun setVocalRemoval(on: Boolean) { vocalRemovalEnabled = on; decks.forEach { it.vocal.enabled = on } }
              fun setStemMutes(drums: Boolean, bass: Boolean, other: Boolean) {
                  stemDrumsMuted = drums; stemBassMuted = bass; stemOtherMuted = other
                  val lowDb = if (bass) -26f else if (drums) -12f else 0f
                  val highDb = if (other) -26f else 0f
                  decks.forEach { it.eq.lowGainDb = lowDb; it.eq.highGainDb = highDb }
              }
              fun setEq(index: Int, low: Float, mid: Float, high: Float) {
                  if (index !in decks.indices) return
                  val d = decks[index]
                  d.eq.lowGainDb = low.coerceIn(-26f, 6f)
                  d.eq.midGainDb = mid.coerceIn(-26f, 6f)
                  d.eq.highGainDb = high.coerceIn(-26f, 6f)
              }
              fun syncBpm(sourceIndex: Int, targetIndex: Int) {
                  if (sourceIndex !in decks.indices || targetIndex !in decks.indices) return
                  val src = decks[sourceIndex].bpm; val tgt = decks[targetIndex].bpm
                  if (src <= 0f || tgt <= 0f) return
                  try { decks[targetIndex].player.setPlaybackSpeed((src / tgt).coerceIn(0.5f, 2f)) } catch (_: Throwable) {}
              }
              fun loadDeck(index: Int, uri: String, name: String = "Loaded") {
                  if (index in decks.indices) {
                      decks[index].load(uri, name)
                      history.add(0, name); if (history.size > 20) history.removeAt(history.size - 1)
                  }
              }
              fun togglePlay(index: Int) { if (index in decks.indices) decks[index].toggle() }
              fun beginScratch(index: Int) { if (index in decks.indices) decks[index].beginScratch() }
              fun scratchMove(index: Int, dy: Float) { if (index in decks.indices) decks[index].scratchMove(dy) }
              fun endScratch(index: Int) { if (index in decks.indices) decks[index].endScratch() }
              fun spinback(index: Int) { if (index in decks.indices) decks[index].spinback() }
              fun brake(index: Int) { if (index in decks.indices) decks[index].brake() }
              fun setCue(index: Int, slot: Int) { if (index in decks.indices) decks[index].setCue(slot) }
              fun jumpCue(index: Int, slot: Int) { if (index in decks.indices) decks[index].jumpToCue(slot) }
              fun toggleLoop(index: Int, beats: Int) { if (index in decks.indices) decks[index].toggleLoop(beats) }
              fun release() { decks.forEach { it.release() } }
          }
