          cat > core-stems/src/main/java/com/djpro/stems/StemSeparator.kt << 'EOF'
          package com.djpro.stems

          import android.content.Context
          import com.djpro.native.DemucsBridge
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.io.File

          /**
           * Wraps Demucs 4-stem separation. On a real device this runs the
           * htdemucs.cpp model via NDK. First-run downloads or bundles the model.
           */
          class StemSeparator(private val context: Context) {

              data class Stems(
                  val vocals: File,
                  val drums: File,
                  val bass: File,
                  val other: File,
              )

              suspend fun separate(inputAudio: File): Stems = withContext(Dispatchers.Default) {
                  if (!DemucsBridge.isModelReady()) {
                      throw IllegalStateException(
                          "Demucs model not bundled. Place htdemucs model in assets/ or " +
                          "download on first run."
                      )
                  }
                  val result = DemucsBridge.separate(inputAudio.absolutePath)
                  val base = inputAudio.parentFile
                  Stems(
                      vocals = File(base, "vocals.wav"),
                      drums  = File(base, "drums.wav"),
                      bass   = File(base, "bass.wav"),
                      other  = File(base, "other.wav"),
                  )
              }

              /** Fallback: mid/side cancellation for instant (lower quality) vocal removal. */
              fun quickVocalRemoval(input: FloatArray): FloatArray {
                  // input is interleaved stereo
                  val out = FloatArray(input.size)
                  var i = 0
                  while (i + 1 < input.size) {
                      val l = input[i]; val r = input[i + 1]
                      val side = (l - r) * 0.5f
                      out[i]     = side * 2f
                      out[i + 1] = -side * 2f
                      i += 2
                  }
                  return out
              }
          }
          EOF

