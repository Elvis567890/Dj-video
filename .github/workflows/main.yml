name: Fix native package name

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create new folder
        run: |
          mkdir -p native/src/main/java/com/djpro/nativecore

      - name: Patch native/build.gradle.kts (namespace)
        run: |
          cat > native/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.library")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.djpro.nativecore"
              compileSdk = 34
              defaultConfig {
                  minSdk = 26
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++17"
                          arguments += "-DANDROID_STL=c++_shared"
                      }
                  }
              }
              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              ndkVersion = "26.1.10909125"
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

      - name: Write NativeBridge.kt in new package
        run: |
          cat > native/src/main/java/com/djpro/nativecore/NativeBridge.kt << 'EOF'
          package com.djpro.nativecore

          object NativeBridge {
              init { System.loadLibrary("djpro_native") }
              external fun startEngine(): Boolean
              external fun stopEngine()
              external fun loadDeck(id: Int, data: FloatArray, volume: Float)
              external fun setDeckVolume(id: Int, volume: Float)
              external fun scratchDeck(id: Int, rate: Float)
          }

          object DemucsBridge {
              external fun isModelReady(): Boolean
              external fun separate(path: String): String
          }
          EOF

      - name: Delete old package folder
        run: |
          rm -rf native/src/main/java/com/djpro/native

      - name: Patch OboeEngine.cpp JNI names
        run: |
          cat > native/src/main/cpp/oboe/OboeEngine.cpp << 'EOF'
          #include <oboe/Oboe.h>
          #include <android/log.h>
          #include <cmath>
          #include <vector>
          #include <mutex>

          #define LOG_TAG "DJProOboe"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          class OboeEngine : public oboe::AudioStreamDataCallback {
          public:
              oboe::DataCallbackResult onAudioReady(
                  oboe::AudioStream *stream, void *audioData, int32_t numFrames) override {
                  float *out = static_cast<float*>(audioData);
                  int ch = stream->getChannelCount();
                  std::lock_guard<std::mutex> lock(mMutex);
                  for (int i = 0; i < numFrames * ch; ++i) out[i] = 0.0f;
                  for (auto &deck : mDecks) {
                      if (!deck.active) continue;
                      for (int i = 0; i < numFrames; ++i) {
                          if (deck.pos >= deck.buffer.size()) { deck.active = false; break; }
                          float s = deck.buffer[deck.pos++] * deck.volume;
                          for (int c = 0; c < ch; ++c) out[i*ch + c] += s;
                      }
                  }
                  for (int i = 0; i < numFrames * ch; ++i)
                      out[i] = std::tanh(out[i]);
                  return oboe::DataCallbackResult::Continue;
              }

              bool start() {
                  oboe::AudioStreamBuilder b;
                  b.setDirection(oboe::Direction::Output);
                  b.setPerformanceMode(oboe::PerformanceMode::LowLatency);
                  b.setFormat(oboe::AudioFormat::Float);
                  b.setChannelCount(oboe::ChannelCount::Stereo);
                  b.setSampleRate(48000);
                  b.setDataCallback(this);
                  oboe::Result r = b.openStream(mStream);
                  if (r != oboe::Result::OK) return false;
                  mStream->requestStart();
                  return true;
              }

              void stop() { if (mStream) { mStream->requestStop(); mStream->close(); } }

              struct Deck { std::vector<float> buffer; size_t pos = 0; float volume = 1.0f; bool active = false; };

              void loadDeck(int id, const float* data, size_t n, float vol) {
                  std::lock_guard<std::mutex> lock(mMutex);
                  if (id >= (int)mDecks.size()) mDecks.resize(id+1);
                  mDecks[id].buffer.assign(data, data+n);
                  mDecks[id].pos = 0; mDecks[id].volume = vol; mDecks[id].active = true;
              }

              void setDeckVolume(int id, float v) {
                  std::lock_guard<std::mutex> lock(mMutex);
                  if (id < (int)mDecks.size()) mDecks[id].volume = v;
              }

          private:
              std::shared_ptr<oboe::AudioStream> mStream;
              std::vector<Deck> mDecks;
              std::mutex mMutex;
          };

          static OboeEngine* gEngine = nullptr;

          extern "C" {
              JNIEXPORT jboolean JNICALL
              Java_com_djpro_nativecore_NativeBridge_startEngine(JNIEnv*, jobject) {
                  if (!gEngine) gEngine = new OboeEngine();
                  return gEngine->start();
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_nativecore_NativeBridge_stopEngine(JNIEnv*, jobject) {
                  if (gEngine) { gEngine->stop(); delete gEngine; gEngine = nullptr; }
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_nativecore_NativeBridge_loadDeck(JNIEnv* env, jobject,
                                                              jint id, jfloatArray data, jfloat vol) {
                  jsize n = env->GetArrayLength(data);
                  jfloat* buf = env->GetFloatArrayElements(data, nullptr);
                  if (gEngine) gEngine->loadDeck(id, buf, n, vol);
                  env->ReleaseFloatArrayElements(data, buf, 0);
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_nativecore_NativeBridge_setDeckVolume(JNIEnv*, jobject, jint id, jfloat v) {
                  if (gEngine) gEngine->setDeckVolume(id, v);
              }
              JNIEXPORT void JNICALL
              Java_com_djpro_nativecore_NativeBridge_scratchDeck(JNIEnv*, jobject, jint id, jfloat rate) {
                  (void)id; (void)rate;
              }
          }
          EOF

      - name: Patch DemucsBridge.cpp JNI names
        run: |
          cat > native/src/main/cpp/demucs/DemucsBridge.cpp << 'EOF'
          #include <jni.h>
          #include <android/log.h>
          #define LOG_TAG "DJProDemucs"
          #define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

          extern "C" {
              JNIEXPORT jboolean JNICALL
              Java_com_djpro_nativecore_DemucsBridge_isModelReady(JNIEnv*, jobject) {
                  return false;
              }
              JNIEXPORT jstring JNICALL
              Java_com_djpro_nativecore_DemucsBridge_separate(JNIEnv* env, jobject, jstring path) {
                  (void)path;
                  return env->NewStringUTF("not_implemented");
              }
          }
          EOF

      - name: Patch SixDeckEngine.kt import
        run: |
          cat > core-audio/src/main/java/com/djpro/audio/SixDeckEngine.kt << 'EOF'
          package com.djpro.audio

          import android.content.Context
          import com.djpro.nativecore.NativeBridge
          import kotlin.math.cos
          import kotlin.math.sin

          class SixDeckEngine(private val context: Context) {
              data class DeckState(
                  var loaded: Boolean = false,
                  var volume: Float = 1.0f,
                  var playing: Boolean = false,
                  var muteVocals: Boolean = false,
                  var muteDrums: Boolean = false,
                  var muteBass: Boolean = false,
                  var muteOther: Boolean = false,
              )

              val decks = MutableList(6) { DeckState() }
              var crossfader: Float = 0.5f
                  private set
              var masterVolume: Float = 1.0f
                  private set

              init { NativeBridge.startEngine() }

              fun setCrossfader(v: Float) {
                  crossfader = v.coerceIn(0f, 1f)
                  val a = cos(crossfader * Math.PI / 2).toFloat()
                  val b = sin(crossfader * Math.PI / 2).toFloat()
                  NativeBridge.setDeckVolume(0, a * decks[0].volume)
                  NativeBridge.setDeckVolume(1, b * decks[1].volume)
              }

              fun setMasterVolume(v: Float) {
                  masterVolume = v.coerceIn(0f, 1f)
                  for (i in 0 until 6) NativeBridge.setDeckVolume(i, masterVolume * decks[i].volume)
              }

              fun loadDeck(id: Int, samples: FloatArray, volume: Float = 1f) {
                  decks[id].loaded = true
                  decks[id].volume = volume
                  NativeBridge.loadDeck(id, samples, volume * masterVolume)
              }

              fun toggleStem(id: Int, stem: String) {
                  val d = decks[id]
                  when (stem) {
                      "vocals" -> d.muteVocals = !d.muteVocals
                      "drums"  -> d.muteDrums = !d.muteDrums
                      "bass"   -> d.muteBass = !d.muteBass
                      "other"  -> d.muteOther = !d.muteOther
                  }
              }

              fun release() = NativeBridge.stopEngine()
          }
          EOF

      - name: Patch StemSeparator.kt import
        run: |
          cat > core-stems/src/main/java/com/djpro/stems/StemSeparator.kt << 'EOF'
          package com.djpro.stems

          import com.djpro.nativecore.DemucsBridge
          import java.io.File

          class StemSeparator {
              data class Stems(val vocals: File, val drums: File, val bass: File, val other: File)

              fun isReady(): Boolean = DemucsBridge.isModelReady()

              fun quickVocalRemoval(input: FloatArray): FloatArray {
                  val out = FloatArray(input.size)
                  var i = 0
                  while (i + 1 < input.size) {
                      val l = input[i]; val r = input[i + 1]
                      val side = (l - r) * 0.5f
                      out[i] = side * 2f
                      out[i + 1] = -side * 2f
                      i += 2
                  }
                  return out
              }
          }
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix: rename native package to nativecore (keyword conflict)" || echo "nothing"
          git push
