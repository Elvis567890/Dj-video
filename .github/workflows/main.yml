              fun toggle() { if (isPlaying) pause() else play() }
              fun setVolume(v: Float) { try { player.volume = v.coerceIn(0f, 1f) } catch (_: Throwable) {} }
              fun setGainDb(db: Float) { gain.gainDb = db.coerceIn(-20f, 20f) }
