          import com.ultimate.dj.audio.SampleStore
          import com.ultimate.dj.audio.SampleSynth
          enum class PadMode { SAMPLER, HOTCUE, LOOP, STEMS }
          private val PAD_NAMES = listOf("KICK", "SNARE", "HIHAT", "CLAP", "PERC", "RISER", "LASER", "SIREN")
          @Composable
          fun SamplerDrawer(
              context: Context,
              bank: Int,
              revision: Long,
              onRequestImport: (Int) -> Unit,
              onClearPad: (Int) -> Unit,
              onBankChange: (Int) -> Unit,
              modifier: Modifier = Modifier
          ) {
              Column(modifier = modifier.fillMaxWidth()
                  .clip(RoundedCornerShape(12.dp))
                  .background(Neon.PANEL_GLASS)
                  .border(1.dp, Neon.MAGENTA.copy(alpha = 0.5f), RoundedCornerShape(12.dp))
                  .padding(8.dp)
              ) {
                  Row(modifier = Modifier.fillMaxWidth().padding(bottom = 6.dp),
                      verticalAlignment = Alignment.CenterVertically) {
                      Text("SAMPLER", color = Neon.MAGENTA, fontSize = 10.sp,
                          fontWeight = FontWeight.Bold, letterSpacing = 3.sp)
                      Spacer(Modifier.width(10.dp))
                      for (b in 0 until 4) {
                          val sel = b == bank
                          Box(modifier = Modifier.clip(RoundedCornerShape(50))
                              .background(if (sel) Neon.MAGENTA.copy(alpha = 0.4f) else Neon.BTN_BG)
                              .border(1.dp, Neon.MAGENTA.copy(alpha = if (sel) 1f else 0.4f), RoundedCornerShape(50))
                              .clickable { onBankChange(b) }
                              .padding(horizontal = 8.dp, vertical = 2.dp)) {
                              Text("B${b + 1}", color = Neon.MAGENTA, fontSize = 8.sp, fontWeight = FontWeight.Bold)
                          }
                          Spacer(Modifier.width(4.dp))
                      }
                      Spacer(Modifier.weight(1f))
                      Text("TAP = PLAY  •  LONG-PRESS = IMPORT",
                          color = Neon.TEXT_FAINT, fontSize = 7.sp, fontWeight = FontWeight.Bold)
                  }
                  Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                      for (i in 0 until 8) {
                          PadSlot(context, bank * 8 + i, i, revision, onRequestImport, onClearPad, Modifier.weight(1f))
                      }
                  }
              }
          }
          @Composable
          private fun PadSlot(
              context: Context, absoluteIndex: Int, displayIndex: Int, revision: Long,
              onRequestImport: (Int) -> Unit, onClearPad: (Int) -> Unit,
              modifier: Modifier = Modifier
          ) {
              val name = PAD_NAMES[displayIndex]
              val accent = if (displayIndex % 2 == 0) Neon.MAGENTA else Neon.PURPLE
              val assigned = remember(absoluteIndex, revision) { SampleStore.getAssignedUri(context, absoluteIndex) }
              val isCustom = assigned != null
              Box(
                  modifier = modifier.aspectRatio(1.5f)
                      .clip(RoundedCornerShape(8.dp))
                      .background(accent.copy(alpha = if (isCustom) 0.30f else 0.12f))
                      .border(
                          width = if (isCustom) 2.dp else 1.dp,
                          color = accent.copy(alpha = if (isCustom) 1f else 0.5f),
                          shape = RoundedCornerShape(8.dp)
                      )
                      .pointerInput(absoluteIndex, revision) {
                          detectTapGestures(
                              onTap = {
                                  val uri = SampleStore.getAssignedUri(context, absoluteIndex)
                                  if (uri != null) SampleFilePlayer.play(context, Uri.parse(uri))
                                  else SampleSynth.play(name)
                              },
                              onLongPress = { onRequestImport(absoluteIndex) }
                          )
                      },
                  contentAlignment = Alignment.Center
              ) {
                  Column(horizontalAlignment = Alignment.CenterHorizontally) {
                      Text(name, color = accent, fontSize = 8.sp, fontWeight = FontWeight.Bold)
                      Text(if (isCustom) "CUSTOM" else "SYNTH",
                          color = accent.copy(alpha = 0.7f), fontSize = 6.sp, fontWeight = FontWeight.Bold)
                  }
                  if (isCustom) {
                      Box(modifier = Modifier.align(Alignment.TopEnd).padding(2.dp)
                          .size(14.dp).clip(CircleShape)
                          .background(Neon.RED.copy(alpha = 0.7f))
                          .clickable { onClearPad(absoluteIndex) },
                          contentAlignment = Alignment.Center) {
                          Text("×", color = Color.White, fontSize = 9.sp, fontWeight = FontWeight.Bold)
                      }
                  }
              }
          }
          EOF

      - name: LibraryScanner and Browser
        run: |
          cat > app/src/main/java/com/ultimate/dj/audio/LibraryScanner.kt << 'EOF'
          package com.ultimate.dj.audio
          import android.content.Context
          import android.database.Cursor
          import android.provider.MediaStore
          data class Track(
              val id: Long,
              val uri: String,
              val title: String,
              val artist: String,
              val durationMs: Long,
              val isVideo: Boolean
          )
          object LibraryScanner {
              fun scan(context: Context, query: String = ""): List<Track> {
                  val out = mutableListOf<Track>()
                  val audioProj = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.TITLE,
                      MediaStore.Audio.Media.ARTIST,
                      MediaStore.Audio.Media.DURATION
                  )
                  try {
                      val sel = if (query.isBlank()) null else "${MediaStore.Audio.Media.TITLE} LIKE ?"
                      val args = if (query.isBlank()) null else arrayOf("%$query%")
                      val c: Cursor? = context.contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, audioProj, sel, args,
                          "${MediaStore.Audio.Media.TITLE} ASC")
                      c?.use {
                          val idI = it.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val tiI = it.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val arI = it.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          val duI = it.getColumnIndexOrThrow(MediaStore.Audio.Media.DURATION)
                          while (it.moveToNext() && out.size < 200) {
                              val id = it.getLong(idI)
                              val uri = android.content.ContentUris.withAppendedId(
                                  MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, id).toString()
                              out.add(Track(id, uri, it.getString(tiI) ?: "Unknown",
                                  it.getString(arI) ?: "Unknown", it.getLong(duI), false))
                          }
                      }
                  } catch (_: Throwable) {}
                  return out
              }
          }
          EOF

