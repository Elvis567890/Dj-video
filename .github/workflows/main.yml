      - name: DeviceCapabilities
        run: |
          cat > app/src/main/java/com/ultimate/dj/DeviceCapabilities.kt << 'EOF'
          package com.ultimate.dj
          import android.app.ActivityManager
          import android.content.Context
          object DeviceCapabilities {
              fun isLowEnd(context: Context): Boolean {
                  val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  return am.isLowRamDevice
              }
              fun ramGb(context: Context): Int {
                  val am = context.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val info = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(info)
                  return (info.totalMem / (1024L * 1024L * 1024L)).toInt()
              }
          }
          EOF

      - name: DSP processors
        run: |
          cat > app/src/main/java/com/ultimate/dj/dsp/EchoAudioProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class EchoAudioProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var mix: Float = 0.35f
              @Volatile var wetOnly: Boolean = false
              private var delayBuffer = ShortArray(0)
              private var writePos = 0
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  val samples = (inputFormat.sampleRate * 0.28f).toInt().coerceAtLeast(1)
                  delayBuffer = ShortArray(samples * inputFormat.channelCount); writePos = 0
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled || delayBuffer.isEmpty()) out.put(inputBuffer)
                  else while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short; val d = delayBuffer[writePos]
                      val wet = (d * mix).toInt()
                      val mixed = (if (wetOnly) wet else s + wet).coerceIn(-32768, 32767).toShort()
                      delayBuffer[writePos] = s; out.putShort(mixed)
                      writePos = (writePos + 1) % delayBuffer.size
                  }
                  out.flip()
              }
              override fun onFlush() { delayBuffer.fill(0); writePos = 0 }
              override fun onReset() { delayBuffer = ShortArray(0) }
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/dsp/FilterAudioProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class FilterAudioProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var depth: Float = 0.15f
              @Volatile var highPass: Boolean = false
              private var prev = FloatArray(2)
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  prev = FloatArray(inputFormat.channelCount); return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val ch = prev.size; var i = 0
                  val a = depth.coerceIn(0.01f, 1f)
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f
                      val c = i % ch
                      val filtered = if (enabled) {
                          if (highPass) s - (a * s + (1 - a) * prev[c]).also { prev[c] = it }
                          else (a * s + (1 - a) * prev[c]).also { prev[c] = it }
                      } else s
                      out.putShort((filtered * 32767f).coerceIn(-32768f, 32767f).toInt().toShort()); i++
                  }
                  out.flip()
              }
              override fun onFlush() { prev.fill(0f) }
              override fun onReset() { prev = FloatArray(2) }
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/dsp/VocalRemovalProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class VocalRemovalProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled) out.put(inputBuffer)
                  else {
                      while (inputBuffer.remaining() >= 4) {
                          val l = inputBuffer.short.toInt(); val r = inputBuffer.short.toInt()
                          val side = (l - r) / 2
                          out.putShort((side * 2).coerceIn(-32768, 32767).toShort())
                          out.putShort((-side * 2).coerceIn(-32768, 32767).toShort())
                      }
                      while (inputBuffer.remaining() > 0) out.put(inputBuffer.get())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/dsp/EqProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import kotlin.math.pow
          class EqProcessor : BaseAudioProcessor() {
              @Volatile var lowGainDb = 0f
              @Volatile var midGainDb = 0f
              @Volatile var highGainDb = 0f
              private var channels = 2
              private var lowPrev = FloatArray(2)
              private var hpPrevIn = FloatArray(2)
              private var hpPrevOut = FloatArray(2)
              private var lpCoeff = 0f
              private var hpCoeff = 0f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  channels = inputFormat.channelCount
                  lowPrev = FloatArray(channels); hpPrevIn = FloatArray(channels); hpPrevOut = FloatArray(channels)
                  val dt = 1f / inputFormat.sampleRate
                  val rcLp = 1f / (2f * Math.PI.toFloat() * 200f); lpCoeff = dt / (rcLp + dt)
                  val rcHp = 1f / (2f * Math.PI.toFloat() * 4000f); hpCoeff = rcHp / (rcHp + dt)
                  return inputFormat
              }
              private fun dbToLin(db: Float) = if (db == 0f) 1f else 10f.pow(db / 20f)
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val ch = channels; var i = 0
                  val lg = dbToLin(lowGainDb); val mg = dbToLin(midGainDb); val hg = dbToLin(highGainDb)
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f; val c = i % ch
                      lowPrev[c] += lpCoeff * (s - lowPrev[c]); val low = lowPrev[c]
                      hpPrevOut[c] = hpCoeff * (hpPrevOut[c] + s - hpPrevIn[c]); hpPrevIn[c] = s; val high = hpPrevOut[c]
                      val mid = s - low - high
                      val y = (low * lg + mid * mg + high * hg).coerceIn(-1f, 1f)
                      out.putShort((y * 32767f).toInt().toShort()); i++
                  }
                  out.flip()
              }
              override fun onFlush() { lowPrev.fill(0f); hpPrevIn.fill(0f); hpPrevOut.fill(0f) }
              override fun onReset() { lowPrev = FloatArray(2); hpPrevIn = FloatArray(2); hpPrevOut = FloatArray(2) }
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/dsp/MasterLimiterProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          import kotlin.math.tanh
          class MasterLimiterProcessor : BaseAudioProcessor() {
              @Volatile var ceiling: Float = 0.92f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat() / 32768f
                      val limited = tanh(s.toDouble()).toFloat() * ceiling
                      out.putShort((limited * 32767f).toInt().toShort())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/dsp/KeyLockProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class KeyLockProcessor : BaseAudioProcessor() {
              @Volatile var enabled: Boolean = false
              @Volatile var speed: Float = 1f
              private var channelCount = 2
              private var lastSample = ShortArray(2)
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  channelCount = inputFormat.channelCount
                  lastSample = ShortArray(channelCount)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  if (!enabled || speed == 1f) {
                      out.put(inputBuffer)
                  } else {
                      var i = 0
                      while (inputBuffer.remaining() >= 2) {
                          val s = inputBuffer.short
                          val c = i % channelCount
                          val mixed = ((lastSample[c].toInt() + s.toInt()) / 2).toShort()
                          lastSample[c] = s
                          out.putShort(mixed)
                          i++
                      }
                  }
                  out.flip()
              }
              override fun onFlush() { lastSample.fill(0) }
              override fun onReset() { lastSample = ShortArray(2) }
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/dsp/GainProcessor.kt << 'EOF'
          package com.ultimate.dj.dsp
          import androidx.media3.common.C
          import androidx.media3.common.audio.AudioProcessor
          import androidx.media3.common.audio.BaseAudioProcessor
          import java.nio.ByteBuffer
          class GainProcessor : BaseAudioProcessor() {
              @Volatile var gainDb: Float = 0f
              override fun onConfigure(inputFormat: AudioProcessor.AudioFormat): AudioProcessor.AudioFormat {
                  if (inputFormat.encoding != C.ENCODING_PCM_16BIT) throw AudioProcessor.UnhandledAudioFormatException(inputFormat)
                  return inputFormat
              }
              override fun queueInput(inputBuffer: ByteBuffer) {
                  val out = replaceOutputBuffer(inputBuffer.remaining())
                  val g = if (gainDb == 0f) 1f else Math.pow(10.0, gainDb / 20.0).toFloat()
                  while (inputBuffer.remaining() >= 2) {
                      val s = inputBuffer.short.toFloat()
                      out.putShort((s * g).coerceIn(-32768f, 32767f).toInt().toShort())
                  }
                  out.flip()
              }
              override fun onFlush() {}
              override fun onReset() {}
          }
          EOF

      - name: Analyzers
        run: |
          cat > app/src/main/java/com/ultimate/dj/audio/BeatAnalyzer.kt << 'EOF'
          package com.ultimate.dj.audio
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import java.nio.ByteBuffer
          import java.nio.ByteOrder
          import kotlin.math.sqrt
          object BeatAnalyzer {
              fun analyze(uri: String): Float {
                  return try {
                      val extractor = MediaExtractor()
                      extractor.setDataSource(uri)
                      var audioTrack = -1
                      var sampleRate = 44100
                      var channels = 2
                      for (i in 0 until extractor.trackCount) {
                          val fmt = extractor.getTrackFormat(i)
                          if (fmt.getString(MediaFormat.KEY_MIME)?.startsWith("audio/") == true) {
                              audioTrack = i
                              sampleRate = fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE)
                              channels = fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT)
                              break
                          }
                      }
                      if (audioTrack < 0) { extractor.release(); return 120f }
                      extractor.selectTrack(audioTrack)
                      val hopSize = 512
                      val buf = ByteBuffer.allocate(hopSize * channels * 2).order(ByteOrder.LITTLE_ENDIAN)
                      val energies = mutableListOf<Float>()
                      var reads = 0
                      while (energies.size < 2000 && reads < 4000) {
                          buf.clear()
                          val n = extractor.readSampleData(buf, 0)
                          if (n < 0) break
                          buf.position(0); buf.limit(n)
                          var sum = 0L
                          while (buf.remaining() >= 2) {
                              val s = buf.short.toInt()
                              sum += s.toLong() * s.toLong()
                          }
                          energies.add(sqrt(sum.toDouble() / hopSize).toFloat())
                          reads++
                          extractor.advance()
                      }
                      extractor.release()
                      estimateBpm(energies, sampleRate, hopSize)
                  } catch (_: Throwable) { 120f }
              }
              private fun estimateBpm(energies: List<Float>, sampleRate: Int, hopSize: Int): Float {
                  if (energies.size < 100) return 120f
                  val onsets = FloatArray(energies.size)
                  for (i in 1 until energies.size) {
                      val diff = energies[i] - energies[i - 1]
                      onsets[i] = if (diff > 0) diff else 0f
                  }
                  val minLag = (sampleRate * 0.3f / hopSize).toInt()
                  val maxLag = (sampleRate * 1.0f / hopSize).toInt()
                  var bestLag = 0; var bestScore = 0f
                  for (lag in minLag..maxLag) {
                      var score = 0f
                      for (i in 0 until onsets.size - lag) score += onsets[i] * onsets[i + lag]
                      if (score > bestScore) { bestScore = score; bestLag = lag }
                  }
                  if (bestLag == 0) return 120f
                  val secondsPerBeat = bestLag.toFloat() * hopSize / sampleRate
                  return (60f / secondsPerBeat).coerceIn(60f, 200f)
              }
          }
