          cat > core-dsp/src/main/java/com/djpro/dsp/EffectChain.kt << 'EOF'
          package com.djpro.dsp

          /**
           * Simple effect chain applied to a deck's audio before it's sent to the mixer.
           * Real implementation would use Media3 AudioProcessor or Oboe-level DSP.
           */
          class EffectChain {
              var echoMix: Float = 0f       // 0..1
              var filterCutoff: Float = 1f  // 0..1, 1 = fully open
              var flangerMix: Float = 0f
              var reverbMix: Float = 0f
              var delayTimeMs: Int = 280

              fun apply(samples: FloatArray): FloatArray {
                  var s = samples
                  if (filterCutoff < 1f) s = lowPass(s, filterCutoff)
                  if (echoMix > 0f) s = echo(s, echoMix)
                  if (flangerMix > 0f) s = flanger(s, flangerMix)
                  if (reverbMix > 0f) s = reverb(s, reverbMix)
                  return s
              }

              private fun lowPass(input: FloatArray, cutoff: Float): FloatArray {
                  val out = FloatArray(input.size)
                  val alpha = cutoff.coerceIn(0.01f, 1f)
                  var prev = 0f
                  for (i in input.indices) {
                      prev = alpha * input[i] + (1 - alpha) * prev
                      out[i] = prev
                  }
                  return out
              }

              private fun echo(input: FloatArray, mix: Float): FloatArray {
                  val delaySamples = (48000 * delayTimeMs / 1000f).toInt()
                  val out = input.copyOf()
                  for (i in delaySamples until input.size) {
                      out[i] += input[i - delaySamples] * mix
                  }
                  return out
              }

              private fun flanger(input: FloatArray, mix: Float): FloatArray {
                  val out = FloatArray(input.size)
                  val lfoPeriod = 48000 / 2  // 0.5 Hz
                  for (i in input.indices) {
                      val mod = (Math.sin(2 * Math.PI * i / lfoPeriod) * 5).toInt()
                      val idx = (i - mod).coerceAtLeast(0)
                      out[i] = input[i] * (1 - mix) + input[idx] * mix
                  }
                  return out
              }

              private fun reverb(input: FloatArray, mix: Float): FloatArray {
                  // Simple Schroeder-style reverb (3 combs)
                  val combs = intArrayOf(1557, 1617, 1491)
                  val out = input.copyOf()
                  for (c in combs) {
                      for (i in c until input.size) {
                          out[i] += out[i - c] * mix * 0.3f
                      }
                  }
                  return out
              }
          }
          EOF

