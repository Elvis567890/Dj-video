          package com.ultimate.dj.audio
          import android.content.Context
          import android.net.Uri
          object SampleStore {
              private const val PREFS = "dj_sampler_v3"
              private const val PADS_PER_BANK = 8
              private const val BANKS = 4
              fun padCount() = PADS_PER_BANK * BANKS
              private fun key(bank: Int, pad: Int) = "pad_${bank}_$pad"
              private fun prefs(c: Context) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
              fun getAssignedUri(context: Context, index: Int): String? {
                  if (index !in 0 until padCount()) return null
                  return prefs(context).getString(key(index / PADS_PER_BANK, index % PADS_PER_BANK), null)
              }
              fun assign(context: Context, index: Int, uri: Uri?) {
                  if (index !in 0 until padCount()) return
                  val k = key(index / PADS_PER_BANK, index % PADS_PER_BANK)
                  prefs(context).edit().apply {
                      if (uri == null) remove(k) else putString(k, uri.toString())
                  }.apply()
              }
              fun clearAll(context: Context) { prefs(context).edit().clear().apply() }
          }
          EOF

          cat > app/src/main/java/com/ultimate/dj/audio/SampleFilePlayer.kt << 'EOF'
          package com.ultimate.dj.audio
          import android.content.Context
          import android.media.AudioAttributes
          import android.media.MediaPlayer
          import android.net.Uri
          object SampleFilePlayer {
              private val active = mutableListOf<MediaPlayer>()
              fun play(context: Context, uri: Uri, onError: (() -> Unit)? = null) {
                  try {
                      val mp = MediaPlayer()
                      mp.setAudioAttributes(AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC).build())
                      mp.setDataSource(context, uri)
                      mp.setOnCompletionListener { p -> try { p.release() } catch (_: Throwable) {}; active.remove(p) }
                      mp.setOnErrorListener { p, _, _ -> try { p.release() } catch (_: Throwable) {}; active.remove(p); onError?.invoke(); true }
                      mp.prepare(); mp.start(); active.add(mp)
                      if (active.size > 8) { val o = active.removeAt(0); try { o.release() } catch (_: Throwable) {} }
                  } catch (_: Throwable) { onError?.invoke() }
              }
              fun stopAll() {
                  for (mp in active.toList()) { try { mp.stop() } catch (_: Throwable) {}; try { mp.release() } catch (_: Throwable) {} }
                  active.clear()
              }
          }
